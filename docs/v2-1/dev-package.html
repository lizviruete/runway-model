t=\"24\" fill=\"#be123c\"><\u002Frect>\n            <rect x=\"550\" y=\"212\" width=\"52\" height=\"40\" fill=\"#f0abfc\" stroke=\"#c026d3\" stroke-width=\"1\"><\u002Frect>\n            <rect x=\"550\" y=\"200\" width=\"52\" height=\"12\" fill=\"#4338ca\"><\u002Frect>\n\n            <rect x=\"646\" y=\"276\" width=\"52\" height=\"24\" fill=\"#fdba74\" stroke=\"#ea580c\" stroke-width=\"1\"><\u002Frect>\n            <rect x=\"646\" y=\"252\" width=\"52\" height=\"24\" fill=\"#be123c\"><\u002Frect>\n            <rect x=\"646\" y=\"240\" width=\"52\" height=\"12\" fill=\"#f0abfc\" stroke=\"#c026d3\" stroke-width=\"1\"><\u002Frect>\n\n            <rect x=\"742\" y=\"276\" width=\"52\" height=\"24\" fill=\"#fdba74\" stroke=\"#ea580c\" stroke-width=\"1\"><\u002Frect>\n            <rect x=\"742\" y=\"271\" width=\"52\" height=\"5\" fill=\"#be123c\"><\u002Frect>\n\n            <line x1=\"838\" y1=\"300\" x2=\"890\" y2=\"300\" stroke=\"#9ca3af\" stroke-width=\"2\"><\u002Fline>\n\n            <line x1=\"816\" y1=\"46\" x2=\"816\" y2=\"300\" stroke=\"#dc2626\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"><\u002Fline>\n            <text x=\"812\" y=\"40\" text-anchor=\"end\" font-size=\"11\" fill=\"#dc2626\">cash-zero · Apr 29<\u002Ftext>\n\n            <polyline points=\"96,145 192,93 288,121 384,149 480,177 576,212 672,247 768,274 864,300\" fill=\"none\" stroke=\"#fff\" stroke-width=\"4\"><\u002Fpolyline>\n            <polyline points=\"96,145 192,93 288,121 384,149 480,177 576,212 672,247 768,274 864,300\" fill=\"none\" stroke=\"#111827\" stroke-width=\"2\"><\u002Fpolyline>\n            <circle cx=\"576\" cy=\"212\" r=\"3.5\" fill=\"#111827\"><\u002Fcircle>\n\n            <text x=\"96\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Aug '26<\u002Ftext>\n            <text x=\"192\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Sep '26<\u002Ftext>\n            <text x=\"288\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Oct '26<\u002Ftext>\n            <text x=\"384\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Nov '26<\u002Ftext>\n            <text x=\"480\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Dec '26<\u002Ftext>\n            <text x=\"576\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#374151\" font-weight=\"600\">Jan '27<\u002Ftext>\n            <text x=\"672\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Feb '27<\u002Ftext>\n            <text x=\"768\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Mar '27<\u002Ftext>\n            <text x=\"864\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Apr '27<\u002Ftext>\n            <circle cx=\"192\" cy=\"332\" r=\"2.5\" fill=\"#9ca3af\"><\u002Fcircle>\n            <circle cx=\"576\" cy=\"332\" r=\"2.5\" fill=\"#9ca3af\"><\u002Fcircle>\n            <text x=\"864\" y=\"292\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#9ca3af\">depleted<\u002Ftext>\n          <\u002Fsvg>\n\n                  <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:12.5px;margin-top:6px\">\n          <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:11px;height:11px;border-radius:3px;background:#0f766e\"><\u002Fspan>Everyday Checking<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:11px;height:11px;border-radius:3px;background:#7dd3fc;border:1px solid #0284c7\"><\u002Fspan>Savings<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:11px;height:11px;border-radius:3px;background:#4338ca\"><\u002Fspan>High-Yield Savings<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:11px;height:11px;border-radius:3px;background:#f0abfc;border:1px solid #c026d3\"><\u002Fspan>Brokerage<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:11px;height:11px;border-radius:3px;background:#be123c\"><\u002Fspan>Roth IRA<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:11px;height:11px;border-radius:3px;background:#fdba74;border:1px solid #ea580c\"><\u002Fspan>Pre-tax IRA<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:14px;height:0;border-top:2px solid #111827\"><\u002Fspan>Net liquid<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:20px;align-items:flex-start;margin-top:16px;padding-top:16px;border-top:1px solid #f3f4f6\">\n  <div style=\"width:236px;background:#fff;border:1px solid #d1d5db;border-radius:10px;box-shadow:0 6px 18px rgba(17,24,39,.10);padding:12px 14px\">\n              <div style=\"font-size:13px;font-weight:600;color:#111827;margin-bottom:2px\">Jan 2027<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#6b7280;margin-bottom:9px\">opening $12,500 · closing $7,500<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:5px;font-size:12.5px\">\n                <div style=\"display:flex;align-items:center;gap:7px;color:#9ca3af\"><span style=\"width:9px;height:9px;border-radius:2px;background:#0f766e\"><\u002Fspan><span style=\"flex:1\">Everyday Checking<\u002Fspan><span>$0<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:7px;color:#9ca3af\"><span style=\"width:9px;height:9px;border-radius:2px;background:#7dd3fc\"><\u002Fspan><span style=\"flex:1\">Savings<\u002Fspan><span>$0<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:9px;height:9px;border-radius:2px;background:#4338ca\"><\u002Fspan><span style=\"flex:1\">High-Yield Savings<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">$1,500<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:9px;height:9px;border-radius:2px;background:#f0abfc\"><\u002Fspan><span style=\"flex:1\">Brokerage<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">$5,000<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:9px;height:9px;border-radius:2px;background:#be123c\"><\u002Fspan><span style=\"flex:1\">Roth IRA<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">$3,000<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:7px;color:#6b7280\"><span style=\"width:9px;height:9px;border-radius:2px;border:1px dashed #9ca3af\"><\u002Fspan><span style=\"flex:1;text-decoration:line-through\">Pre-tax IRA<\u002Fspan><span>excluded<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:9px;padding-top:8px;border-top:1px solid #f3f4f6;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:#374151\">\n                <div style=\"display:flex;justify-content:space-between\"><span>Net liquid<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">$11,000<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between\"><span>Cash flow<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">−$7,900<\u002Fspan><\u002Fdiv>\n                <div style=\"color:#6b7280;font-size:11.5px;margin-top:3px\">Living spend → $5,200 from this month<\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fdiv>\n          <div style=\"flex:1;min-width:220px\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:8px\">Tooltip — Jan '27 hovered<\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.6;color:#6b7280\">Shown beside the chart here so the mockup stays readable. In the product it follows the cursor at a 12px offset and flips side near the right edge — it never covers the hovered column. The hovered month is marked in the plot above by the band wash and the bolded axis label.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px;margin-bottom:20px\">\n      <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Read this before building — stock, not flow<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px 32px\">\n        <div>\n          <p style=\"margin:0 0 11px;font-size:14.5px;line-height:1.6;color:#374151\">A column's height is <strong style=\"color:#111827\">the money still in the accounts at the end of that month<\u002Fstrong> — a balance. It is not the month's spending and not the drawdown. So a column carries one segment per account that still holds money, and a six-account scenario shows six colors in month one, because all six accounts still hold something.<\u002Fp>\n          <p style=\"margin:0 0 11px;font-size:14.5px;line-height:1.6;color:#374151\">Segments drop out as tap order drains them: tap 1 empties, its color disappears, the stack gets shorter. The number of colors falls over time and never rises. That decay <em>is<\u002Fem> the drawdown made visible, and it is the same series geometry as today's area chart — the conversion is an encoding change only, not a data change.<\u002Fp>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#374151\">It has to stay a stock, because everything anchored to this chart is a stock: the Net liquid overlay is a balance, and cash-zero is the month the stack reaches zero. Neither is expressible on a flow chart.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"background:#f7f7f8;border:1px solid #e5e7eb;border-radius:10px;padding:16px 18px;margin-bottom:14px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:10px\">The one-color-per-column reading<\u002Fdiv>\n            <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#374151\">A column that stays one color until an account empties is a <strong style=\"color:#111827\">flow<\u002Fstrong> chart: height = that month's spending, segments = which accounts covered it. That is a real and useful chart — it is now the third view below, not a change to this one.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:14px 16px\">\n            <div style=\"font-size:13.5px;line-height:1.6;color:#374151\"><strong>Because columns invite the flow reading<\u002Fstrong> — bars usually mean per-period amounts — every view gains an explicit subhead and the balance views gain a y-axis title, <strong>\"Balance at month end\"<\u002Fstrong>. That labelling is not optional; it is the cost of moving off area.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px\">\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Chart specification — series palette<\u002Fdiv>\n        <p style=\"margin:0 0 14px;font-size:13.5px;line-height:1.6;color:#374151\">The palette alternates <strong>dark and light by tap-order position<\u002Fstrong>. Adjacent bands in a stack therefore differ in luminance as well as hue, which is what keeps 8 series readable — and readable in grayscale and for dichromatic vision, where a hue-only palette collapses. Light fills carry a 1px stroke of their dark partner so a thin band never disappears against white.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#374151\">\n          <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"width:16px;height:16px;border-radius:4px;background:#0f766e\"><\u002Fspan><span style=\"width:56px\">#0f766e<\u002Fspan><span style=\"color:#6b7280\">tap 1 · dark<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"width:16px;height:16px;border-radius:4px;background:#7dd3fc;border:1px solid #0284c7\"><\u002Fspan><span style=\"width:56px\">#7dd3fc<\u002Fspan><span style=\"color:#6b7280\">tap 2 · light · stroke #0284c7<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"width:16px;height:16px;border-radius:4px;background:#4338ca\"><\u002Fspan><span style=\"width:56px\">#4338ca<\u002Fspan><span style=\"color:#6b7280\">tap 3 · dark<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"width:16px;height:16px;border-radius:4px;background:#f0abfc;border:1px solid #c026d3\"><\u002Fspan><span style=\"width:56px\">#f0abfc<\u002Fspan><span style=\"color:#6b7280\">tap 4 · light · stroke #c026d3<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"width:16px;height:16px;border-radius:4px;background:#be123c\"><\u002Fspan><span style=\"width:56px\">#be123c<\u002Fspan><span style=\"color:#6b7280\">tap 5 · dark<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"width:16px;height:16px;border-radius:4px;background:#fdba74;border:1px solid #ea580c\"><\u002Fspan><span style=\"width:56px\">#fdba74<\u002Fspan><span style=\"color:#6b7280\">tap 6 · light · stroke #ea580c<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"width:16px;height:16px;border-radius:4px;background:#065f46\"><\u002Fspan><span style=\"width:56px\">#065f46<\u002Fspan><span style=\"color:#6b7280\">tap 7 · dark<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"width:16px;height:16px;border-radius:4px;background:#86efac;border:1px solid #16a34a\"><\u002Fspan><span style=\"width:56px\">#86efac<\u002Fspan><span style=\"color:#6b7280\">tap 8 · light · stroke #16a34a<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"width:16px;height:16px;border-radius:4px;background:#475569\"><\u002Fspan><span style=\"width:56px\">#475569<\u002Fspan><span style=\"color:#6b7280\">liabilities · out of rotation<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"width:16px;height:16px;border-radius:4px;background:#111827\"><\u002Fspan><span style=\"width:56px\">#111827<\u002Fspan><span style=\"color:#6b7280\">Net liquid line<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;font-size:13px;line-height:1.6;color:#6b7280\">Beyond 8 accounts the rotation repeats from tap 1 with a 12% lightness shift; a 9th account is rare enough that repetition beats inventing indistinguishable hues. Credit lines / HELOC always draw slate #475569 regardless of position, because a liability is not a peer of an asset — and slate is deliberately the one hue absent from the asset rotation.<\u002Fdiv>\n        <div style=\"margin-top:12px;padding:12px 14px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;font-size:13px;line-height:1.55;color:#374151\"><strong>Token flag.<\u002Fstrong> These ten values are the only additions in the release: <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">--chart-series-1…8<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">--chart-liability<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">--chart-net<\u002Fspan>. Everything else in items 1–7 reuses existing values. Net liquid moves from dark green to near-black on purpose: with adjacent color bands, an overlay line has to read as \"not a series.\"<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n          <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Axis, gridlines, geometry<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;color:#374151;font-family:ui-monospace,SFMono-Regular,Menlo,monospace\">\n            <div>plot height &nbsp;<span style=\"color:#6b7280\">260px (unchanged from area chart)<\u002Fspan><\u002Fdiv>\n          <div>y axis title &nbsp;<span style=\"color:#6b7280\">\"Balance at month end\" · 11px #9ca3af · rotated −90°<\u002Fspan><\u002Fdiv>\n            <div>column width &nbsp;<span style=\"color:#6b7280\">band × 0.62, max 52px, min 8px<\u002Fspan><\u002Fdiv>\n            <div>column gap &nbsp;<span style=\"color:#6b7280\">band × 0.38 · no rounded corners (segments must butt)<\u002Fspan><\u002Fdiv>\n            <div>segment order &nbsp;<span style=\"color:#6b7280\">tap 1 at TOP of stack (matches today's band order)<\u002Fspan><\u002Fdiv>\n            <div>y axis &nbsp;<span style=\"color:#6b7280\">0 → nice-max, 5 ticks, 11px #9ca3af, right-aligned at x−8<\u002Fspan><\u002Fdiv>\n            <div>gridlines &nbsp;<span style=\"color:#6b7280\">1px #f1f5f9 · baseline 1px #d1d5db<\u002Fspan><\u002Fdiv>\n            <div>x labels &nbsp;<span style=\"color:#6b7280\">11.5px #9ca3af · \"Aug '26\" · every month ≤14 cols, else every 2nd/3rd<\u002Fspan><\u002Fdiv>\n            <div>cash-zero &nbsp;<span style=\"color:#6b7280\">1.5px #dc2626 dashed 4/4, in the GAP before the first $0 column, labelled \"cash-zero · Apr 29\"<\u002Fspan><\u002Fdiv>\n            <div>net liquid &nbsp;<span style=\"color:#6b7280\">2px #111827 + 4px #fff halo, dots at hover only<\u002Fspan><\u002Fdiv>\n            <div>event dot &nbsp;<span style=\"color:#6b7280\">r 2.5 #9ca3af, 12px below axis label = a step change or end date lands in that month<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n          <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Hover &amp; tooltip<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.55;color:#374151\">\n            <div>Hover target is the whole month band, not the column — a 12px-tall stack must still be hoverable. Hovered band gets a #f7f7f8 wash behind the full plot height; its axis label goes #374151 600.<\u002Fdiv>\n            <div>Tooltip: month · opening/closing · every series in tap order with swatch and balance · zero balances shown in #9ca3af rather than dropped (their absence is information) · excluded series struck through · footer with Net liquid and Cash flow · a final line naming any event in that month (\"Housing → $1,200 from this month\", \"Childcare ends this month\", \"Penalty-free from this month\").<\u002Fdiv>\n            <div>Follows the cursor with 12px offset, flips side at 260px from the right edge, never covers the hovered column. 150ms fade in, none out.<\u002Fdiv>\n            <div>Keyboard: the chart is one tab stop; ← → move month, Home/End jump to first/last, and the tooltip content is mirrored into a live region so it is announced. Escape leaves the chart.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Edge states — all named<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.58;color:#374151\">\n          <div><strong style=\"color:#111827\">Cash-zero marker<\u002Fstrong> — drawn in the gap <em>before<\u002Fem> the first zero column, never through a column, so it reads as a boundary between months rather than an annotation on one. Label sits above the plot, right-aligned to the line.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Flat tail after depletion<\u002Fstrong> — zero-height columns are not drawn. The baseline continues as a 2px #9ca3af rule under those months with a single 10.5px #9ca3af \"depleted\" caption above the first of them, once. No repeated zeros.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Excluded accounts<\u002Fstrong> — no band, legend entry retained (hollow dashed swatch, struck label, \"excluded\"), tooltip row retained. Included balances do not resize to fill the space; the stack simply gets shorter, which is the truth.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Single account<\u002Fstrong> — one column series, legend still shown (it names the series), no special casing. Column width still capped at 52px so it does not become a monolith.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Never depletes in horizon<\u002Fstrong> — no red marker at all. Caption under the chart: \"No cash-zero within this 24-month view.\" The absence of the marker is the good news; do not substitute a green marker.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">All excluded / no accounts<\u002Fstrong> — empty plot with axes drawn and one line of copy; no illustration, no dashed placeholder columns.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Negative stack<\u002Fstrong> — a drawn HELOC pushes a series below zero: axis extends below the baseline, liability segments draw downward in slate with a 45° hatch, and the baseline stays 1px #d1d5db at true zero.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Legend, accessibility, responsive<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.58;color:#374151\">\n          <div><strong style=\"color:#111827\">Legend order is tap order<\u002Fstrong>, always, including excluded accounts in their position. Reordering an account card reorders the legend and the stack in the same frame — that coupling is the point.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Unnamed accounts<\u002Fstrong> fall back to the type label (\"High-yield savings\"), never to \"Account 4\" and never omitted. Two unnamed accounts of the same type get a trailing index: \"Brokerage / investment (2)\".<\u002Fdiv>\n          <div>Legend swatch 11×11 radius 3; label 12.5px #374151 = 8.9:1. Every fill has ≥3:1 against its neighbours in the stack and ≥3:1 against white for the stroked light fills.<\u002Fdiv>\n          <div>Adjacent-pair ratios: teal/sky 3.2:1 · sky/indigo 4.8:1 · indigo/fuchsia 4.5:1 · fuchsia/rose 3.7:1 · rose/orange 3.9:1 · orange/emerald 4.2:1 · emerald/green 5.2:1.<\u002Fdiv>\n          <div>Color never carries meaning alone: the tooltip and legend name every series, and the axis-adjacent event dots are paired with tooltip text.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Tablet<\u002Fstrong> — chart full width under the inputs panel; x labels thin to every 2nd month. <strong style=\"color:#111827\">Mobile<\u002Fstrong> — plot height 200px, column min-width 8px, x labels every 3rd month rotated 0° (never diagonal), legend becomes a 2-column grid, tooltip becomes a bottom sheet pinned above the fold on tap. Net liquid line stays 2px.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n    <div id=\"item5b\" style=\"border-top:1px solid #e5e7eb;padding-top:34px;margin-bottom:26px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\">\n        <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#6b7280\">05b<\u002Fspan>\n        <h3 style=\"margin:0;font-size:22px;font-weight:700;letter-spacing:-0.01em\">Three views, and the terminology that separates them<\u002Fh3>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 24px;font-size:15px;line-height:1.62;color:#4b5563;max-width:78ch;text-wrap:pretty\">The toggle currently offers Total and By account, which distinguishes the split but not the <em>quantity<\u002Fem> — so both read as \"the chart\" and either can be misread as flow. Renaming it around the quantity fixes that, and makes room for the drawdown view.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px\">\n        <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n          <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#15803d;margin-bottom:14px\">Recommendation — three, not four<\u002Fdiv>\n          <p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.6;color:#374151\">Ship three. An account-agnostic drawdown view would be a single-color bar of monthly spending — which is the ledger's OUT column drawn as a rectangle. It adds no fact the summary line and the ledger do not already state, and the whole reason the drawdown view earns its place is <em>which account covered it<\u002Fem>. Take the split away and nothing is left.<\u002Fp>\n          <p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.6;color:#374151\">Four views also breaks the toggle: a 2×2 matrix (balance/drawdown × total/by account) needs two controls or four labels that all read alike, and one of the four cells is empty of value. Three segments with a rule between the balance pair and the drawdown one keeps a single control and states the stock/flow break visually.<\u002Fp>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#374151\">If the total-drawdown view is wanted later, the cheaper form is a toggle <em>inside<\u002Fem> the drawdown view that merges the account segments into one — not a fourth top-level view.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n          <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Naming — final<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px;font-size:13.5px;line-height:1.55\">\n            <div>\n              <div style=\"color:#111827;font-weight:600;margin-bottom:3px\">Toggle: Balances · total &nbsp;/&nbsp; Balances · by account &nbsp;/&nbsp; Drawdown · by account<\u002Fdiv>\n              <div style=\"color:#6b7280\">\"Balances\" and \"Drawdown\" are the two quantities; total / by account is the split. The shared word is what tells a user the first two are the same chart seen two ways and the third is a different question.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"color:#111827;font-weight:600;margin-bottom:3px\">Why not \"Depletion\"<\u002Fdiv>\n              <div style=\"color:#6b7280\">Depletion names the endpoint — the moment an account hits zero — which is what the <em>balance<\u002Fem> views show. The flow view is about the money moving each month, and \"drawdown\" is the word an advisor already uses for it. If you prefer Depletion, it should swap with cash-zero language, not with drawdown.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"color:#111827;font-weight:600;margin-bottom:3px\">Headers &amp; subheads<\u002Fdiv>\n              <div style=\"color:#374151;display:flex;flex-direction:column;gap:6px;margin-top:5px\">\n                <div><strong>Runway<\u002Fstrong> — What you have left at the end of each month, all accounts combined.<\u002Fdiv>\n                <div><strong>Runway by account<\u002Fstrong> — What you have left at the end of each month, split by account in tap order.<\u002Fdiv>\n                <div><strong>Drawdown by account<\u002Fstrong> — What you spent each month, and which accounts covered it.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #e5e7eb;border-radius:12px;background:#f7f7f8;padding:26px;margin-bottom:24px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:18px\">Mockup — new view 3, Drawdown by account<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px\">\n            <div style=\"display:flex;align-items:baseline;gap:10px\">\n              <span style=\"font-size:13px;font-weight:600;letter-spacing:.06em;color:#6b7280\">DRAWDOWN BY ACCOUNT<\u002Fspan>\n              <span style=\"font-size:13px;color:#6b7280\">Example scenario<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:stretch;border:1px solid #d1d5db;border-radius:8px;overflow:hidden\">\n              <span style=\"font-size:12.5px;padding:5px 12px;color:#374151\">Balances · total<\u002Fspan>\n              <span style=\"font-size:12.5px;padding:5px 12px;color:#374151;border-left:1px solid #e5e7eb\">Balances · by account<\u002Fspan>\n              <span style=\"font-size:12.5px;padding:5px 12px;background:#111827;color:#fff;border-left:1px solid #d1d5db\">Drawdown · by account<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#6b7280;margin-bottom:10px\">What you spent each month, and which accounts covered it.<\u002Fdiv>\n\n          <svg sc-camel-view-box=\"0 0 960 358\" style=\"width:100%;height:auto;display:block\" role=\"img\" aria-label=\"Stacked column chart of monthly spending by funding source, August 2026 to April 2027. Income covers part of each month; the rest is drawn from accounts in tap order.\">\n            <rect x=\"526\" y=\"40\" width=\"72\" height=\"260\" fill=\"#f7f7f8\"><\u002Frect>\n            <line x1=\"76\" y1=\"300\" x2=\"944\" y2=\"300\" stroke=\"#d1d5db\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"76\" y1=\"240\" x2=\"944\" y2=\"240\" stroke=\"#f1f5f9\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"76\" y1=\"180\" x2=\"944\" y2=\"180\" stroke=\"#f1f5f9\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"76\" y1=\"120\" x2=\"944\" y2=\"120\" stroke=\"#f1f5f9\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"76\" y1=\"60\" x2=\"944\" y2=\"60\" stroke=\"#f1f5f9\" stroke-width=\"1\"><\u002Fline>\n            <text x=\"68\" y=\"304\" text-anchor=\"end\" font-size=\"11\" fill=\"#9ca3af\">$0<\u002Ftext>\n            <text x=\"68\" y=\"244\" text-anchor=\"end\" font-size=\"11\" fill=\"#9ca3af\">$3k<\u002Ftext>\n            <text x=\"68\" y=\"184\" text-anchor=\"end\" font-size=\"11\" fill=\"#9ca3af\">$6k<\u002Ftext>\n            <text x=\"68\" y=\"124\" text-anchor=\"end\" font-size=\"11\" fill=\"#9ca3af\">$9k<\u002Ftext>\n            <text x=\"68\" y=\"64\" text-anchor=\"end\" font-size=\"11\" fill=\"#9ca3af\">$12k<\u002Ftext>\n            <text x=\"22\" y=\"170\" text-anchor=\"middle\" font-size=\"11\" fill=\"#9ca3af\" transform=\"rotate(-90 22 170)\">Spent this month<\u002Ftext>\n\n            <line x1=\"76\" y1=\"142\" x2=\"944\" y2=\"142\" stroke=\"#cbd5e1\" stroke-width=\"1\" stroke-dasharray=\"3 4\"><\u002Fline>\n            <text x=\"944\" y=\"136\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#9ca3af\">out ≈ $7,900/mo<\u002Ftext>\n\n            <rect x=\"70\" y=\"222\" width=\"52\" height=\"78\" fill=\"#eef2f6\" stroke=\"#cbd5e1\" stroke-width=\"1\"><\u002Frect>\n            <rect x=\"70\" y=\"142\" width=\"52\" height=\"80\" fill=\"#0f766e\"><\u002Frect>\n\n            <rect x=\"166\" y=\"222\" width=\"52\" height=\"78\" fill=\"#eef2f6\" stroke=\"#cbd5e1\" stroke-width=\"1\"><\u002Frect>\n            <rect x=\"166\" y=\"198\" width=\"52\" height=\"24\" fill=\"#0f766e\"><\u002Frect>\n            <rect x=\"166\" y=\"142\" width=\"52\" height=\"56\" fill=\"#7dd3fc\" stroke=\"#0284c7\" stroke-width=\"1\"><\u002Frect>\n\n            <rect x=\"262\" y=\"222\" width=\"52\" height=\"78\" fill=\"#eef2f6\" stroke=\"#cbd5e1\" stroke-width=\"1\"><\u002Frect>\n            <rect x=\"262\" y=\"142\" width=\"52\" height=\"80\" fill=\"#7dd3fc\" stroke=\"#0284c7\" stroke-width=\"1\"><\u002Frect>\n\n            <rect x=\"358\" y=\"222\" width=\"52\" height=\"78\" fill=\"#eef2f6\" stroke=\"#cbd5e1\" stroke-width=\"1\"><\u002Frect>\n            <rect x=\"358\" y=\"202\" width=\"52\" height=\"20\" fill=\"#7dd3fc\" stroke=\"#0284c7\" stroke-width=\"1\"><\u002Frect>\n            <rect x=\"358\" y=\"142\" width=\"52\" height=\"60\" fill=\"#4338ca\"><\u002Frect>\n\n            <rect x=\"454\" y=\"222\" width=\"52\" height=\"78\" fill=\"#eef2f6\" stroke=\"#cbd5e1\" stroke-width=\"1\"><\u002Frect>\n            <rect x=\"454\" y=\"142\" width=\"52\" height=\"80\" fill=\"#4338ca\"><\u002Frect>\n\n            <rect x=\"550\" y=\"222\" width=\"52\" height=\"78\" fill=\"#eef2f6\" stroke=\"#cbd5e1\" stroke-width=\"1\"><\u002Frect>\n            <rect x=\"550\" y=\"192\" width=\"52\" height=\"30\" fill=\"#4338ca\"><\u002Frect>\n            <rect x=\"550\" y=\"142\" width=\"52\" height=\"50\" fill=\"#f0abfc\" stroke=\"#c026d3\" stroke-width=\"1\"><\u002Frect>\n\n            <rect x=\"646\" y=\"222\" width=\"52\" height=\"78\" fill=\"#eef2f6\" stroke=\"#cbd5e1\" stroke-width=\"1\"><\u002Frect>\n            <rect x=\"646\" y=\"142\" width=\"52\" height=\"80\" fill=\"#f0abfc\" stroke=\"#c026d3\" stroke-width=\"1\"><\u002Frect>\n\n            <rect x=\"742\" y=\"142\" width=\"52\" height=\"158\" fill=\"#eef2f6\" stroke=\"#cbd5e1\" stroke-width=\"1\"><\u002Frect>\n            <rect x=\"838\" y=\"142\" width=\"52\" height=\"158\" fill=\"#eef2f6\" stroke=\"#cbd5e1\" stroke-width=\"1\"><\u002Frect>\n\n            <line x1=\"726\" y1=\"126\" x2=\"726\" y2=\"300\" stroke=\"#9ca3af\" stroke-width=\"1\" stroke-dasharray=\"4 4\"><\u002Fline>\n            <text x=\"734\" y=\"120\" font-size=\"11\" fill=\"#6b7280\">income covers it from here<\u002Ftext>\n\n            <text x=\"96\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Aug '26<\u002Ftext>\n            <text x=\"192\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Sep '26<\u002Ftext>\n            <text x=\"288\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Oct '26<\u002Ftext>\n            <text x=\"384\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Nov '26<\u002Ftext>\n            <text x=\"480\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Dec '26<\u002Ftext>\n            <text x=\"576\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#374151\" font-weight=\"600\">Jan '27<\u002Ftext>\n            <text x=\"672\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Feb '27<\u002Ftext>\n            <text x=\"768\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Mar '27<\u002Ftext>\n            <text x=\"864\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#6b7280\">Apr '27<\u002Ftext>\n            <circle cx=\"192\" cy=\"332\" r=\"2.5\" fill=\"#9ca3af\"><\u002Fcircle>\n            <circle cx=\"576\" cy=\"332\" r=\"2.5\" fill=\"#9ca3af\"><\u002Fcircle>\n            <text x=\"480\" y=\"348\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#9ca3af\">Segments stack in tap order. Height is spending, not balance.<\u002Ftext>\n          <\u002Fsvg>\n\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:12.5px;margin-top:8px\">\n            <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:11px;height:11px;border-radius:3px;background:#eef2f6;border:1px solid #cbd5e1\"><\u002Fspan>Covered by income<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:11px;height:11px;border-radius:3px;background:#0f766e\"><\u002Fspan>Everyday Checking<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:11px;height:11px;border-radius:3px;background:#7dd3fc;border:1px solid #0284c7\"><\u002Fspan>Savings<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:11px;height:11px;border-radius:3px;background:#4338ca\"><\u002Fspan>High-Yield Savings<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:11px;height:11px;border-radius:3px;background:#f0abfc;border:1px solid #c026d3\"><\u002Fspan>Brokerage<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:7px;color:#9ca3af\"><span style=\"width:11px;height:11px;border-radius:3px;background:#be123c;opacity:.35\"><\u002Fspan>Roth IRA — not drawn in this view<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px\">\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:12px\">Tooltip — Jan 2027<\u002Fdiv>\n            <div style=\"border:1px solid #d1d5db;border-radius:10px;padding:12px 14px;width:262px\">\n              <div style=\"font-size:13px;font-weight:600;color:#111827;margin-bottom:2px\">Jan 2027<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#6b7280;margin-bottom:9px\">spent $7,900 · income $3,913 · drawn $3,987<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:5px;font-size:12.5px\">\n                <div style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:9px;height:9px;border-radius:2px;background:#eef2f6;border:1px solid #cbd5e1\"><\u002Fspan><span style=\"flex:1\">Covered by income<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">$3,913<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:9px;height:9px;border-radius:2px;background:#4338ca\"><\u002Fspan><span style=\"flex:1\">High-Yield Savings<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">$1,500<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:9px;height:9px;border-radius:2px;background:#f0abfc\"><\u002Fspan><span style=\"flex:1\">Brokerage<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">$2,487<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:9px;padding-top:8px;border-top:1px solid #f3f4f6;font-size:12.5px;color:#374151\">\n                <div style=\"display:flex;justify-content:space-between\"><span>High-Yield Savings runs out<\u002Fspan><span>this month<\u002Fspan><\u002Fdiv>\n                <div style=\"color:#6b7280;font-size:11.5px;margin-top:3px\">Living spend → $5,200 from this month<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.55;color:#6b7280;margin-top:12px\">Only sources that contributed are listed — a zero row here means nothing, unlike the balance views where a $0 balance is information. The \"runs out\" line is the depletion fact your advisor is looking for, stated in words on the month it happens.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:12px\">What this view answers that the others cannot<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.58;color:#374151\">\n              <div>How much of the burn income is actually absorbing — the pale base segment — and how much is coming out of savings. That ratio is invisible in both balance views.<\u002Fdiv>\n              <div>Which account is funding this month, and the month a source hands off to the next one (two colors in one column = a handoff).<\u002Fdiv>\n              <div>Whether spending itself is changing, since the bar top is the month's outflow: a step change or an expense ending moves the top of the bar, which is the one thing the balance views can only show as a change in slope.<\u002Fdiv>\n              <div style=\"color:#6b7280;padding-top:4px;border-top:1px solid #f3f4f6\">And the honest limit: the bar top is nearly flat, so this view says nothing about how long the money lasts. Cash-zero and Net liquid do not appear here. It is a companion to the runway, never the default.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px\">\n        <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n          <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Spec — view 3<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;color:#374151;font-family:ui-monospace,SFMono-Regular,Menlo,monospace\">\n            <div>column geometry &nbsp;<span style=\"color:#6b7280\">identical to views 1–2<\u002Fspan><\u002Fdiv>\n            <div>y axis &nbsp;<span style=\"color:#6b7280\">0 → nice-max of monthly out · title \"Spent this month\"<\u002Fspan><\u002Fdiv>\n            <div>stack order &nbsp;<span style=\"color:#6b7280\">income at base, then accounts in tap order upward<\u002Fspan><\u002Fdiv>\n            <div>income fill &nbsp;<span style=\"color:#6b7280\">#eef2f6 + 1px #cbd5e1 stroke<\u002Fspan><\u002Fdiv>\n            <div>account fills &nbsp;<span style=\"color:#6b7280\">same --chart-series-1…8 as views 1–2, same account = same color across views<\u002Fspan><\u002Fdiv>\n            <div>out reference &nbsp;<span style=\"color:#6b7280\">1px #cbd5e1 dashed 3/4 at the median monthly out, labelled right<\u002Fspan><\u002Fdiv>\n            <div>handoff marker &nbsp;<span style=\"color:#6b7280\">none — the two-color column IS the marker<\u002Fspan><\u002Fdiv>\n            <div>no cash-zero line &nbsp;<span style=\"color:#6b7280\">and no Net liquid overlay<\u002Fspan><\u002Fdiv>\n            <div>legend &nbsp;<span style=\"color:#6b7280\">income first, then tap order; never-drawn accounts listed at 35% opacity<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px;padding:12px 14px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;font-size:13px;line-height:1.55;color:#374151\"><strong>Token flag.<\u002Fstrong> One addition beyond item 5's ten: <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">--chart-income #eef2f6<\u002Fspan>. Deliberately a near-neutral outside the asset rotation — income is not an account, and it must not compete with one.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n          <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Edge states — view 3<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.58;color:#374151\">\n            <div><strong style=\"color:#111827\">Income covers the month<\u002Fstrong> — bar is entirely the pale base; no account segments. A single dashed marker and one caption, \"income covers it from here\", on the first such month only.<\u002Fdiv>\n            <div><strong style=\"color:#111827\">After depletion<\u002Fstrong> — spending continues with nothing to fund it. The unfunded portion draws as a 45° #d1d5db hatch with a #9ca3af outline, legend entry \"Not covered\". This is the one place this view beats the balance views outright: it shows the shortfall rather than a flat zero line.<\u002Fdiv>\n            <div><strong style=\"color:#111827\">Excluded accounts<\u002Fstrong> — never appear as a segment (they fund nothing) and sit in the legend at 35% opacity, struck through, \"excluded\".<\u002Fdiv>\n            <div><strong style=\"color:#111827\">One-time expenses<\u002Fstrong> — a spike in the bar top; tooltip names it. The dashed out-reference stays at the median so the spike reads as a spike.<\u002Fdiv>\n            <div><strong style=\"color:#111827\">Zero spending<\u002Fstrong> — no column drawn, month label retained.<\u002Fdiv>\n            <div><strong style=\"color:#111827\">Never draws on accounts<\u002Fstrong> — every bar pale; caption \"Income covers your spending every month in this view.\" No empty state needed.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n          <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Toggle, a11y, responsive, scope<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.58;color:#374151\">\n            <div>Segmented control gains a third segment and a 1px #d1d5db rule (heavier than the #e5e7eb divider between the balance pair) before Drawdown — the visual statement that a different quantity starts there.<\u002Fdiv>\n            <div>Default view is unchanged: <strong style=\"color:#111827\">Balances · by account<\u002Fstrong>. Selection persists in the URL param alongside the rest of the scenario state.<\u002Fdiv>\n            <div>Control is a <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">radiogroup<\u002Fspan> labelled \"Chart view\"; each option's accessible name is the label plus its subhead, so the stock/flow difference is announced, not just seen. Arrow keys move between views.<\u002Fdiv>\n            <div>Pale income fill on white is 1.1:1, so its 1px #cbd5e1 stroke is load-bearing and mandatory; the legend and tooltip name it in words. #6b7280 caption on #fff = 4.83:1.<\u002Fdiv>\n            <div><strong style=\"color:#111827\">Tablet<\u002Fstrong> — three segments still fit on one row at 12.5px. <strong style=\"color:#111827\">Mobile<\u002Fstrong> — the control wraps to two rows (balance pair, then drawdown) rather than shrinking type; plot height 200px as in views 1–2.<\u002Fdiv>\n            <div style=\"color:#6b7280;padding-top:4px;border-top:1px solid #f3f4f6\"><strong style=\"color:#111827\">Scope note.<\u002Fstrong> View 3 is new surface, beyond the brief's item 5. It shares the palette, geometry and tooltip shell with views 1–2, so it is cheap after them — but it can ship a release later without holding item 5 up.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <section id=\"item6\" style=\"margin-bottom:80px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\">\n      <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#6b7280\">06<\u002Fspan>\n      <h2 style=\"margin:0;font-size:27px;font-weight:700;letter-spacing:-0.015em\">Cash flow, positive or negative<\u002Fh2>\n      <span style=\"font-size:12.5px;color:#6b7280\">small · highest risk of getting it wrong<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 28px;font-size:15.5px;line-height:1.62;color:#4b5563;max-width:78ch;text-wrap:pretty\">One summary line above the ledger carries the burn rate and the turnaround month. A new <strong style=\"color:#111827\">NET<\u002Fstrong> column carries per-month magnitude in neutral type. Emphasis exists in exactly one place: the month the sign changes.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1.05fr 1fr;gap:20px;margin-bottom:28px\">\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#15803d;margin-bottom:12px\">The decision<\u002Fdiv>\n        <p style=\"margin:0 0 11px;font-size:14.5px;line-height:1.6;color:#374151\">Burn rate is a <em>rate<\u002Fem>, and a rate belongs in one place, stated once: <strong>\"Burning about $7,900/mo · turns positive Mar 2027\"<\u002Fstrong>. Repeating it as twelve red numbers does not add information — it adds twelve reminders.<\u002Fp>\n        <p style=\"margin:0 0 11px;font-size:14.5px;line-height:1.6;color:#374151\">The NET column stays because \"which month is worst\" is a real question. It is set in #334155 with a small directional caret, sign always explicit, tabular. Deficit is the expected state during an income gap, so it gets the ordinary treatment — <strong>ordinariness is the design<\u002Fstrong>.<\u002Fp>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#374151\">The one thing worth interrupting for is a sign change, because it is invisible today and it is the answer to \"when does this turn around\". It gets a quiet chip on that row and a named month in the summary. Nothing else is emphasised, ever.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:12px\">What lost, and why<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:13px\">\n          <div>\n            <div style=\"font-size:14px;font-weight:600;color:#111827;margin-bottom:3px\">Red negative per row<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#6b7280\">A wall of danger-colored numbers restating a fact the user already knows, to someone in financial distress. Fails principle 2 outright. Not shipped in any form.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:14px;font-weight:600;color:#111827;margin-bottom:3px\">Green for positive months<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#6b7280\">Rejected too, and for the same reason inverted: if positive is rewarded with color, negative is punished by its absence. The turnaround month is marked by a word, not a hue.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:14px;font-weight:600;color:#111827;margin-bottom:3px\">Per-row sparkline or bar-in-cell<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#6b7280\">Twelve mini-charts inside a table that already expands into per-account lines. The shape of the burn is already the chart's job, immediately above. One sparkline in the summary line does the same work once.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:14px;font-weight:600;color:#111827;margin-bottom:3px\">\"Runway health\" score or status word<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#6b7280\">This is the emotional layer the competitor was torn down for. Upward states quantities and dates; it does not grade the user.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #e5e7eb;border-radius:12px;background:#f7f7f8;padding:26px;margin-bottom:28px\">\n      <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:18px\">Mockup — ledger header + NET column<\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px\">\n          <div style=\"display:flex;align-items:baseline;gap:10px\">\n            <span style=\"font-size:13px;font-weight:600;letter-spacing:.06em;color:#6b7280\">LEDGER<\u002Fspan>\n            <span style=\"font-size:13px;color:#6b7280\">The auditable trail behind every number<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;border:1px solid #d1d5db;border-radius:8px;overflow:hidden\">\n            <span style=\"font-size:12.5px;padding:5px 12px;background:#111827;color:#fff\">Monthly<\u002Fspan>\n            <span style=\"font-size:12.5px;padding:5px 12px;color:#374151\">Transactions<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#6b7280;margin-bottom:12px\">A forward projection from your as-of date — not a bank statement. Lines marked \"≈\" are modeled estimates (spend, yield, taxes); the rest are inputs you entered.<\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid #e5e7eb;border-radius:10px;background:#fcfcfd;margin-bottom:14px\">\n          <svg width=\"96\" height=\"26\" sc-camel-view-box=\"0 0 96 26\" style=\"flex:none\" aria-hidden=\"true\">\n            <line x1=\"0\" y1=\"13\" x2=\"96\" y2=\"13\" stroke=\"#e5e7eb\" stroke-width=\"1\"><\u002Fline>\n            <rect x=\"2\" y=\"13\" width=\"6\" height=\"7\" fill=\"#cbd5e1\"><\u002Frect>\n            <rect x=\"12\" y=\"4\" width=\"6\" height=\"9\" fill=\"#94a3b8\"><\u002Frect>\n            <rect x=\"22\" y=\"13\" width=\"6\" height=\"6\" fill=\"#cbd5e1\"><\u002Frect>\n            <rect x=\"32\" y=\"13\" width=\"6\" height=\"6\" fill=\"#cbd5e1\"><\u002Frect>\n            <rect x=\"42\" y=\"13\" width=\"6\" height=\"6\" fill=\"#cbd5e1\"><\u002Frect>\n            <rect x=\"52\" y=\"13\" width=\"6\" height=\"6\" fill=\"#cbd5e1\"><\u002Frect>\n            <rect x=\"62\" y=\"13\" width=\"6\" height=\"6\" fill=\"#cbd5e1\"><\u002Frect>\n            <rect x=\"72\" y=\"6\" width=\"6\" height=\"7\" fill=\"#94a3b8\"><\u002Frect>\n            <rect x=\"82\" y=\"3\" width=\"6\" height=\"10\" fill=\"#94a3b8\"><\u002Frect>\n          <\u002Fsvg>\n          <div style=\"flex:1;font-size:14.5px;color:#111827\">Burning about <strong style=\"font-variant-numeric:tabular-nums\">$7,900<\u002Fstrong>/mo · turns positive <strong>Mar 2027<\u002Fstrong><\u002Fdiv>\n          <div style=\"font-size:13px;color:#6b7280;font-variant-numeric:tabular-nums\">$1,400/mo less than baseline<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1.05fr 1fr;font-size:12px;font-weight:600;letter-spacing:.06em;color:#6b7280;padding:0 8px 10px;border-bottom:1px solid #e5e7eb\">\n          <div>MONTH<\u002Fdiv><div style=\"text-align:right\">OPENING<\u002Fdiv><div style=\"text-align:right\">IN<\u002Fdiv><div style=\"text-align:right\">OUT<\u002Fdiv><div style=\"text-align:right\">NET<\u002Fdiv><div style=\"text-align:right\">CLOSING<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1.05fr 1fr;font-size:14.5px;color:#111827;padding:13px 8px;border-bottom:1px solid #f3f4f6;font-variant-numeric:tabular-nums\">\n          <div style=\"color:#374151\">▸ Oct 2026<\u002Fdiv><div style=\"text-align:right\">$29,427<\u002Fdiv><div style=\"text-align:right;color:#15803d\">$3,913<\u002Fdiv><div style=\"text-align:right;color:#dc2626\">−$7,900<\u002Fdiv><div style=\"text-align:right;color:#334155\"><span style=\"color:#9ca3af;font-size:11px\">▾<\u002Fspan> −$3,987<\u002Fdiv><div style=\"text-align:right\">$25,440<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1.05fr 1fr;font-size:14.5px;color:#111827;padding:13px 8px;border-bottom:1px solid #f3f4f6;font-variant-numeric:tabular-nums\">\n          <div style=\"color:#374151\">▸ Nov 2026<\u002Fdiv><div style=\"text-align:right\">$25,440<\u002Fdiv><div style=\"text-align:right;color:#15803d\">$3,913<\u002Fdiv><div style=\"text-align:right;color:#dc2626\">−$7,900<\u002Fdiv><div style=\"text-align:right;color:#334155\"><span style=\"color:#9ca3af;font-size:11px\">▾<\u002Fspan> −$3,987<\u002Fdiv><div style=\"text-align:right\">$21,454<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1.05fr 1fr;font-size:14.5px;color:#111827;padding:13px 8px;border-bottom:1px solid #f3f4f6;font-variant-numeric:tabular-nums;background:#fcfcfd\">\n          <div style=\"color:#374151;display:flex;align-items:center;gap:8px\">▸ Mar 2027 <span style=\"font-size:11px;font-weight:600;letter-spacing:.04em;color:#111827;border:1px solid #d1d5db;border-radius:5px;padding:1px 6px;background:#fff\">TURNS POSITIVE<\u002Fspan><\u002Fdiv><div style=\"text-align:right\">$5,600<\u002Fdiv><div style=\"text-align:right;color:#15803d\">$9,100<\u002Fdiv><div style=\"text-align:right;color:#dc2626\">−$7,900<\u002Fdiv><div style=\"text-align:right;color:#111827;font-weight:600\"><span style=\"color:#6b7280;font-size:11px\">▴<\u002Fspan> +$1,200<\u002Fdiv><div style=\"text-align:right\">$6,800<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1.05fr 1fr;font-size:14.5px;color:#111827;padding:13px 8px;font-variant-numeric:tabular-nums\">\n          <div style=\"color:#374151\">▸ Apr 2027<\u002Fdiv><div style=\"text-align:right\">$6,800<\u002Fdiv><div style=\"text-align:right;color:#15803d\">$9,100<\u002Fdiv><div style=\"text-align:right;color:#dc2626\">−$7,900<\u002Fdiv><div style=\"text-align:right;color:#334155\"><span style=\"color:#9ca3af;font-size:11px\">▴<\u002Fspan> +$1,200<\u002Fdiv><div style=\"text-align:right\">$8,000<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px\">\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Copy — every state, final<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;font-size:13.5px;line-height:1.58;color:#374151\">\n          <div><strong style=\"color:#111827\">Turns positive in horizon<\u002Fstrong><br>Burning about $7,900/mo · turns positive Mar 2027<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Never positive<\u002Fstrong><br>Burning about $7,900/mo · no month turns positive in this view<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Positive throughout<\u002Fstrong><br>Adding about $1,200/mo · positive every month in this view<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Turns negative<\u002Fstrong><br>Adding about $1,200/mo · turns negative Jan 2027<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Varies month to month<\u002Fstrong><br>Burning $4,000–$9,300/mo · turns positive Mar 2027 <span style=\"color:#6b7280\">(range when the spread exceeds 25% of the mean)<\u002Fspan><\u002Fdiv>\n          <div><strong style=\"color:#111827\">Exactly zero<\u002Fstrong><br>NET cell reads <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">$0<\u002Fspan>, no caret, no chip. Summary: \"Flat about $0/mo\".<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Delta (right side)<\u002Fstrong><br>$1,400/mo less than baseline · $600/mo more than baseline · Same as baseline<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Row chips<\u002Fstrong><br>TURNS POSITIVE · TURNS NEGATIVE · INCOME RESUMES (on the month a recurring income starts; chip only, no NET emphasis)<\u002Fdiv>\n          <div style=\"color:#6b7280\">\"About\" is deliberate and stays. The number is a projection, and rounding it in language is more honest than a false-precision figure.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Redlines &amp; states<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;color:#374151;font-family:ui-monospace,SFMono-Regular,Menlo,monospace\">\n          <div>summary bar &nbsp;<span style=\"color:#6b7280\">1px #e5e7eb · radius 10 · bg #fcfcfd · pad 12/14 · margin-bottom 14<\u002Fspan><\u002Fdiv>\n          <div>summary text &nbsp;<span style=\"color:#6b7280\">14.5px #111827 · figures 600 · tabular-nums<\u002Fspan><\u002Fdiv>\n          <div>delta text &nbsp;<span style=\"color:#6b7280\">13px #6b7280 · right-aligned<\u002Fspan><\u002Fdiv>\n          <div>sparkline &nbsp;<span style=\"color:#6b7280\">96×26 · bars 6px w / 4px gap · #cbd5e1 deficit, #94a3b8 surplus · zero rule #e5e7eb<\u002Fspan><\u002Fdiv>\n          <div>NET column &nbsp;<span style=\"color:#6b7280\">14.5px #334155 · tabular · caret 11px #9ca3af, 6px gap<\u002Fspan><\u002Fdiv>\n          <div>sign-change row &nbsp;<span style=\"color:#6b7280\">bg #fcfcfd · NET #111827 600<\u002Fspan><\u002Fdiv>\n          <div>chip &nbsp;<span style=\"color:#6b7280\">11px 600 · 1px #d1d5db · radius 5 · pad 1/6 · bg #fff<\u002Fspan><\u002Fdiv>\n          <div>col widths &nbsp;<span style=\"color:#6b7280\">NET inserted between OUT and CLOSING at 1.05fr; others unchanged<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.55;color:#374151\">\n          <div><strong style=\"color:#111827\">Hover<\u002Fstrong> — existing row hover only; NET does not change color.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Expanded month<\u002Fstrong> — per-account lines are unchanged; NET is not repeated per account (it is a month-level fact).<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Transactions view<\u002Fstrong> — no NET column; the summary bar persists above both views.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Empty / no data<\u002Fstrong> — summary bar hidden entirely rather than showing \"$0/mo\".<\u002Fdiv>\n          <div><strong style=\"color:#111827\">CSV<\u002Fstrong> — Monthly CSV gains a <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">net<\u002Fspan> column; no other export change.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Accessibility &amp; responsive<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.6;color:#374151\">\n          <div>#334155 on #fff = 10.4:1; #6b7280 on #fcfcfd = 4.7:1; chip #111827 on #fff = 16.1:1. The NET signal is sign + caret + magnitude — no color coding at all, so it is unaffected by any form of color blindness.<\u002Fdiv>\n          <div>Caret glyphs are <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">aria-hidden<\u002Fspan>; the cell's accessible name is \"Net cash flow, minus 3,987 dollars\". Chips are real text, read inline with the month.<\u002Fdiv>\n          <div>Summary bar is a <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">&lt;p&gt;<\u002Fspan> in an <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">aria-live=\"polite\"<\u002Fspan> region so pulling a lever announces the new burn rate and turnaround month — the fastest possible answer to \"did that help?\" without sight.<\u002Fdiv>\n          <div>Sparkline is decorative and hidden from AT; the sentence beside it carries everything it shows.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Tablet<\u002Fstrong> — table keeps all six columns; OPENING drops first if needed. <strong style=\"color:#111827\">Mobile<\u002Fstrong> — the wide table becomes stacked month cards: month + chip on line 1, closing balance large on line 2, then a 2×2 of Opening/In/Out/Net at 13px. No horizontal scroll. The summary bar wraps: sentence on line 1, delta on line 2, sparkline hidden below 480px.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"item7\" style=\"margin-bottom:80px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\">\n      <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#6b7280\">07<\u002Fspan>\n      <h2 style=\"margin:0;font-size:27px;font-weight:700;letter-spacing:-0.015em\">Feedback link placement<\u002Fh2>\n      <span style=\"font-size:12.5px;color:#6b7280\">minor<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n        <p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.6;color:#374151\"><strong style=\"color:#111827\">Where:<\u002Fstrong> a page footer below the ledger card — the only surface in Upward that isn't a card — left-aligned to the content column, 40px below the ledger, 13px #6b7280, underlined on hover only. It is the last thing on the page because someone has feedback <em>after<\u002Fem> they have used the model, not before.<\u002Fp>\n        <p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.6;color:#374151\"><strong style=\"color:#111827\">How quiet:<\u002Fstrong> quieter than \"Start fresh\". No icon, no button, no chrome, nothing in the header — the header is where the scenario controls live and a feedback link there competes with work. Opens in a new tab so a scenario in progress is never lost.<\u002Fp>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#374151\">Paired with a privacy line, because a feedback link is the one place a no-backend product invites the suspicion that something is being sent. Say it plainly, once.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #e5e7eb;border-radius:12px;background:#f7f7f8;padding:26px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:16px\">Mockup — page footer<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;height:52px;margin-bottom:40px;display:flex;align-items:center;padding:0 16px;font-size:12.5px;color:#9ca3af\">…ledger card ends<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;font-size:13px;color:#6b7280\">\n          <a href=\"#item7\" style=\"color:#6b7280;text-decoration:none\">Send feedback ↗<\u002Fa>\n          <span style=\"color:#d1d5db\">·<\u002Fspan>\n          <span>Your numbers stay in this browser. Nothing is uploaded.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px;font-size:13px;line-height:1.6;color:#6b7280;font-family:ui-monospace,SFMono-Regular,Menlo,monospace\">13px #6b7280 · margin-top 40 · target _blank rel=\"noopener noreferrer\" · aria-label \"Send feedback, opens in a new tab\" · hover #111827 + underline<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"dnc\" style=\"margin-bottom:72px\">\n    <h2 style=\"margin:0 0 8px;font-size:27px;font-weight:700;letter-spacing:-0.015em\">Do not change<\u002Fh2>\n    <p style=\"margin:0 0 22px;font-size:15.5px;line-height:1.6;color:#4b5563;max-width:78ch\">Surfaces deliberately left alone. If a diff touches one of these, it is out of scope for V2.1.<\u002Fp>\n    <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:26px 28px\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px 32px;font-size:14px;line-height:1.55;color:#374151\">\n        <div>Header, tagline, and the scenario / saved-scenario controls<\u002Fdiv>\n        <div>AS OF card and its helper copy<\u002Fdiv>\n        <div>RUNWAY / CASH-ZERO DATE / VS. BASELINE stat cards, including the red cash-zero date and green vs-baseline figure<\u002Fdiv>\n        <div>Income section: salary field, income line cards, Add income modal<\u002Fdiv>\n        <div>\"Same as baseline\" annotations throughout<\u002Fdiv>\n        <div>Account card face layout: drag order, number chip geometry, name field, balance input, type dropdown, × control<\u002Fdiv>\n        <div>Type dropdown option list and all existing tax-treatment helper text<\u002Fdiv>\n        <div>HELOC / credit-line treatment, including its interest copy and warm color<\u002Fdiv>\n        <div>Ledger IN (green) and OUT (red) columns — see appendix note<\u002Fdiv>\n        <div>Chart view default (Balances · by account) and URL-param persistence<\u002Fdiv>\n        <div>Ledger per-account expanded lines, ≈ pill styling, Monthly / Transactions toggle, both CSV exports<\u002Fdiv>\n        <div>Global type scale, spacing scale, radii, card and input styling<\u002Fdiv>\n        <div>Page background, card borders, shadow treatment<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"appendix\" style=\"margin-bottom:40px\">\n    <h2 style=\"margin:0 0 8px;font-size:27px;font-weight:700;letter-spacing:-0.015em\">Appendix — on record, not built<\u002Fh2>\n    <p style=\"margin:0 0 22px;font-size:15.5px;line-height:1.6;color:#4b5563;max-width:78ch\">Observations from designing this release. None of it is in the specs above.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Observations<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:13px;font-size:14px;line-height:1.6;color:#374151\">\n          <div><strong style=\"color:#111827\">The OUT column is already the wall of red<\u002Fstrong> that item 6 was written to avoid. Item 6 does not touch it, per the do-not-change list, but the exact argument applies: a red figure on every row of a projection where outflow is expected. Worth a one-line change in a later pass — demote OUT to #334155 and let the NET column carry direction — and it would make item 6's restraint coherent rather than lonely.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">The cash-zero date is the app's largest red element.<\u002Fstrong> For the primary user it is the single most anxiety-loaded number on the page, rendered in 34px danger red. It is honest, but \"calm is the differentiator\" and this is the loudest thing in the product. A dark near-black date with a red marker in the chart only would carry the same information with a different emotional register. Not a V2.1 change; worth a decision of its own.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">\"Target monthly spend\" → \"Living spend\"<\u002Fstrong> is the one copy change in item 1 outside the mechanical work. A target is something you can fail. Flagged in case it has meaning I do not know about.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Item 2 and item 4 interact.<\u002Fstrong> An excluded account with a return still compounds silently in stored state. Recommendation: hold the balance frozen while excluded, and say so — \"Balance and settings are kept\" already implies no growth. Confirm before implementing.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Eventual brand alignment<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:13px;font-size:14px;line-height:1.6;color:#374151\">\n          <div>No LizBuilds tokens were used anywhere in this package, per the brief. For the record, when that harmonization is taken up:<\u002Fdiv>\n          <div><strong style=\"color:#111827\">The chart palette is the wrong place to start.<\u002Fstrong> It is the most constrained system in the product — eight series, adjacency contrast, colorblind safety. Cream/forest/sage cannot supply eight distinguishable series, so the chart will need its own palette regardless. Treat it as a permanent exception rather than a harmonization failure.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Type is the highest-leverage swap and the cheapest.<\u002Fstrong> Newsreader on the three stat-card figures and the page title alone would read as branded, with zero interaction risk. The UI type can stay a system sans indefinitely — a financial model should feel like an instrument, not a publication.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Do not bring cream to the input surfaces.<\u002Fstrong> The white-card-on-grey structure is doing real work here: it separates entry from output. Cream fields on a cream page would flatten exactly the distinction the product depends on.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Sequence it after the recovery module<\u002Fstrong>, not before. Brand-level decisions are cheaper once the full surface area exists; re-harmonizing twice is the expensive path.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"border-top:1px solid #e5e7eb;padding-top:20px;font-size:13px;color:#9ca3af\">Upward V2.1 · design → dev package · items 1–7, diff against shipped V2<\u002Fdiv>\n\n  <!--APPEND-->\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
