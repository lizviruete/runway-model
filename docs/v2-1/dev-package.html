  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"d6bdb72f-f8ef-4bfe-9c02-7df0eab65773\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n\n<helmet>\n<style>\n  body { margin:0; background:#f7f7f8; -webkit-font-smoothing:antialiased; font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Helvetica,Arial,sans-serif; }\n  a { color:#111827; text-decoration:underline; text-decoration-color:#c7cbd1; text-underline-offset:2px; }\n  a:hover { color:#000; text-decoration-color:#111827; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:1240px;margin:0 auto;padding:56px 32px 120px;color:#111827\">\n\n  <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:14px\">\n    <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280\">Design → dev handoff<\u002Fdiv>\n    <h1 style=\"margin:0;font-size:38px;font-weight:700;letter-spacing:-0.02em\">Upward V2.1 — developer package<\u002Fh1>\n    <p style=\"margin:0;font-size:17px;line-height:1.55;color:#4b5563;max-width:82ch\">A diff against shipped V2. Seven items, numbered and named to match your build prompt — paste each section next to its item. Existing card, input, modal, segmented-control, chip and ledger patterns are reused throughout; nothing outside the listed surfaces is restyled, and no LizBuilds brand tokens are applied.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:40px\">\n    <span style=\"font-size:12.5px;color:#374151;background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:5px 12px\">Refinement, not redesign<\u002Fspan>\n    <span style=\"font-size:12.5px;color:#374151;background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:5px 12px\">≈ estimate convention preserved<\u002Fspan>\n    <span style=\"font-size:12.5px;color:#374151;background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:5px 12px\">Zero new spacing values<\u002Fspan>\n    <span style=\"font-size:12.5px;color:#374151;background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:5px 12px\">11 new color tokens (chart palette) — flagged<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin-bottom:56px\">\n    <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:26px 28px\">\n      <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">README — build order<\u002Fdiv>\n      <ol style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;font-size:14.5px;line-height:1.5;color:#374151\">\n        <li><strong style=\"color:#111827\">Item 1 — expense primitive.<\u002Fstrong> Data-model change; everything downstream reads from it. Ship the model and the inline row before the chart work.<\u002Fli>\n        <li><strong style=\"color:#111827\">Items 2 + 3 — account assumption fields.<\u002Fstrong> One shared expandable panel serves both. Build together, one component.<\u002Fli>\n        <li><strong style=\"color:#111827\">Item 4 — include / exclude.<\u002Fstrong> Touches card, chart and ledger. Land before item 5 so the chart is built with excluded state in hand.<\u002Fli>\n        <li><strong style=\"color:#111827\">Item 5 — columns + palette.<\u002Fstrong> Depends on 4 for edge states and on the accounts panel for legend order. <strong style=\"color:#111827\">5b<\u002Fstrong> (three views + the new Drawdown chart) reuses all of it and can trail a release.<\u002Fli>\n        <li><strong style=\"color:#111827\">Item 6 — cash-flow signal.<\u002Fstrong> Presentation only; safe to ship last, but do not ship a first pass with per-row color.<\u002Fli>\n        <li><strong style=\"color:#111827\">Item 7 — feedback link.<\u002Fstrong> Ten minutes. Any time.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:26px 28px\">\n      <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">What to watch for<\u002Fdiv>\n      <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:9px;font-size:14.5px;line-height:1.5;color:#374151\">\n        <li>Item 1's whole point is that housing and living spend stay one-click editable. If the amount field ends up behind a modal, the item failed.<\u002Fli>\n        <li>Every default rate is an assumption a user did not make. It must be labelled, reversible, and never silently changed.<\u002Fli>\n        <li>Exclusion is the highest-risk mechanic in the release — it must be legible on the card, the chart and the ledger, or people will read a wrong runway as a bug.<\u002Fli>\n        <li>Item 6 must not arrive as red numbers. Neutral by default, emphasis on state change only.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:10px 28px;padding:18px 0;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;margin-bottom:64px;font-size:14px\">\n    <a href=\"#item1\">1 · Expense model unification<\u002Fa>\n    <a href=\"#item2\">2 · Per-account rate of return<\u002Fa>\n    <a href=\"#item3\">3 · Penalty-free date<\u002Fa>\n    <a href=\"#item4\">4 · Include / exclude<\u002Fa>\n    <a href=\"#item5\">5 · Graph by account, as columns<\u002Fa>\n    <a href=\"#item5b\">5b · Three views + drawdown<\u002Fa>\n    <a href=\"#item6\">6 · Cash flow, positive or negative<\u002Fa>\n    <a href=\"#item7\">7 · Feedback link<\u002Fa>\n    <a href=\"#dnc\">Do not change<\u002Fa>\n    <a href=\"#appendix\">Appendix<\u002Fa>\n  <\u002Fdiv>\n\n  <section id=\"item1\" style=\"margin-bottom:80px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\">\n      <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#6b7280\">01<\u002Fspan>\n      <h2 style=\"margin:0;font-size:27px;font-weight:700;letter-spacing:-0.015em\">Expense model unification<\u002Fh2>\n      <span style=\"font-size:12.5px;color:#6b7280\">largest item · IA change<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 28px;font-size:15.5px;line-height:1.62;color:#4b5563;max-width:78ch;text-wrap:pretty\">One primitive — <em>label · amount · recurring|one-time · starts · ends? · step change? · isEstimate<\u002Fem> — for housing, living spend and everything a user adds. The bespoke housing checkbox is deleted and the general step change replaces it.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px\">\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#15803d;margin-bottom:12px\">The decision — inline rows, seeded lines pinned<\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.6;color:#374151\">Every expense — seeded or user-added — is the <strong>same row component<\u002Fstrong>, in one list, with the same affordances: label on the left, an always-visible amount input on the right, a meta line underneath, and a details caret. Editing is inline. Nothing is behind a modal once it exists.<\u002Fp>\n        <p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.6;color:#374151\">Housing and living spend are the first two rows and cannot be deleted or reordered. That is the <em>only<\u002Fem> difference, and it is a position, not a capability — so there is no second class of row to learn.<\u002Fp>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#374151\">The existing <strong>Add expense modal<\u002Fstrong> survives for creation only. Creating needs six decisions at once and an atomic commit; editing needs one keystroke on an amount. Different jobs, different surfaces.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:12px\">What lost, and why<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div>\n            <div style=\"font-size:14px;font-weight:600;color:#111827;margin-bottom:3px\">Generic list, all editing in the modal<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#6b7280\">Cleanest model, worst product. The two most-touched inputs go from one click to open-edit-save, and the user loses sight of the chart at the moment they are trying to watch it move. This is the regression the brief names.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:14px;font-weight:600;color:#111827;margin-bottom:3px\">Keep housing + living as bespoke fields above a generic list<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#6b7280\">Preserves speed, but ships the problem it was meant to solve: two shapes for one concept, and step change stays bespoke on housing while living spend still cannot have one.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:14px;font-weight:600;color:#111827;margin-bottom:3px\">Fully inline, including creation via a blank row<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#6b7280\">Attractive, but a half-filled row is live input: an unlabeled $0 line recalculates the runway and re-renders the chart on every keystroke, and \"cash-zero\" flickers while someone types. Creation stays atomic.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #e5e7eb;border-radius:12px;background:#f7f7f8;padding:26px;margin-bottom:28px\">\n      <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:18px\">Mockup — Expenses section, inputs panel (left column, 386px)<\u002Fdiv>\n      <div style=\"display:flex;gap:36px;flex-wrap:wrap;align-items:flex-start\">\n\n        <div style=\"width:386px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:4px\">\n            <div style=\"font-size:19px;font-weight:700;color:#111827\">Expenses<\u002Fdiv>\n            <button style=\"font-size:13px;color:#111827;background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:7px 11px;cursor:pointer\">+ Add expense<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#6b7280;margin-bottom:14px\">$10,700/mo now · $6,700 from Sep 2026<\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n\n            <div style=\"border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;background:#fff\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <div style=\"flex:1;min-width:0;font-size:14.5px;color:#111827\">Housing / rent<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:6px;border:1px solid #d1d5db;border-radius:8px;padding:6px 10px;width:116px;background:#fff\">\n                  <span style=\"font-size:13px;color:#9ca3af\">$<\u002Fspan>\n                  <span style=\"flex:1;text-align:right;font-size:14.5px;color:#111827;font-variant-numeric:tabular-nums\">2,800<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size:11px;color:#9ca3af;padding:4px\">▾<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px\">\n                <span style=\"font-size:12px;color:#6b7280\">Monthly<\u002Fspan>\n                <span style=\"font-size:12px;color:#d1d5db\">·<\u002Fspan>\n                <span style=\"font-size:11.5px;color:#374151;background:#f3f4f6;border-radius:5px;padding:2px 7px\">↘ $1,200 from Sep 2026<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;background:#fff\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <div style=\"flex:1;min-width:0;font-size:14.5px;color:#111827\"><span style=\"color:#15803d\">≈<\u002Fspan> Living spend<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:6px;border:1px solid #d1d5db;border-radius:8px;padding:6px 10px;width:116px;background:#fff\">\n                  <span style=\"font-size:13px;color:#9ca3af\">$<\u002Fspan>\n                  <span style=\"flex:1;text-align:right;font-size:14.5px;color:#111827;font-variant-numeric:tabular-nums\">6,500<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size:11px;color:#9ca3af;padding:4px\">▾<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px\">\n                <span style=\"font-size:12px;color:#6b7280\">Monthly<\u002Fspan>\n                <span style=\"font-size:12px;color:#d1d5db\">·<\u002Fspan>\n                <span style=\"font-size:12px;color:#15803d\">estimate<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"border:1px solid #111827;border-radius:10px;padding:10px 12px;background:#fff\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <div style=\"flex:1;min-width:0;font-size:14.5px;color:#111827\">Childcare<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:6px;border:1px solid #d1d5db;border-radius:8px;padding:6px 10px;width:116px;background:#fff\">\n                  <span style=\"font-size:13px;color:#9ca3af\">$<\u002Fspan>\n                  <span style=\"flex:1;text-align:right;font-size:14.5px;color:#111827;font-variant-numeric:tabular-nums\">1,400<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size:11px;color:#374151;padding:4px\">▴<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px\">\n                <span style=\"font-size:12px;color:#6b7280\">Monthly<\u002Fspan>\n                <span style=\"font-size:12px;color:#d1d5db\">·<\u002Fspan>\n                <span style=\"font-size:11.5px;color:#374151;background:#f3f4f6;border-radius:5px;padding:2px 7px\">ends Dec 2026<\u002Fspan>\n              <\u002Fdiv>\n\n              <div style=\"margin-top:12px;padding-top:12px;border-top:1px solid #f3f4f6;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"display:flex;border:1px solid #d1d5db;border-radius:8px;overflow:hidden\">\n                  <div style=\"flex:1;text-align:center;font-size:13px;padding:7px 0;background:#111827;color:#fff\">Recurring<\u002Fdiv>\n                  <div style=\"flex:1;text-align:center;font-size:13px;padding:7px 0;background:#fff;color:#374151\">One-time<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n                  <div>\n                    <div style=\"font-size:12.5px;color:#374151;margin-bottom:4px\">Starts<\u002Fdiv>\n                    <div style=\"border:1px solid #d1d5db;border-radius:8px;padding:7px 10px;font-size:13.5px;color:#111827\">08/2026<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:12.5px;color:#374151;margin-bottom:4px\">Ends (optional)<\u002Fdiv>\n                    <div style=\"border:1px solid #d1d5db;border-radius:8px;padding:7px 10px;font-size:13.5px;color:#111827\">12/2026<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <span style=\"width:15px;height:15px;border:1px solid #9ca3af;border-radius:4px;display:inline-block\"><\u002Fspan>\n                  <span style=\"font-size:13.5px;color:#374151\">Amount changes later<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <span style=\"width:15px;height:15px;border:1px solid #9ca3af;border-radius:4px;display:inline-block\"><\u002Fspan>\n                  <span style=\"font-size:13.5px;color:#374151\">This is an estimate (shows as ≈)<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between\">\n                  <button style=\"font-size:13px;color:#6b7280;background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px\">Remove<\u002Fbutton>\n                  <button style=\"font-size:13px;color:#111827;background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:6px 12px;cursor:pointer\">Done<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;min-width:320px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px 18px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:10px\">Row anatomy<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.65;color:#374151\">Row = <em>face<\u002Fem> (label · amount input · caret) + <em>meta line<\u002Fem> (cadence · schedule chips) + <em>details drawer<\u002Fem> (segmented control, starts, ends, step change, estimate flag, remove). The face never changes height when the drawer opens.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px 18px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:10px\">At-a-glance signals (meta line)<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:#374151\">\n              <div><span style=\"font-size:11.5px;color:#374151;background:#f3f4f6;border-radius:5px;padding:2px 7px\">↘ $1,200 from Sep 2026<\u002Fspan> &nbsp;step change down, with the month<\u002Fdiv>\n              <div><span style=\"font-size:11.5px;color:#374151;background:#f3f4f6;border-radius:5px;padding:2px 7px\">↗ $3,400 from Jan 2027<\u002Fspan> &nbsp;step change up<\u002Fdiv>\n              <div><span style=\"font-size:11.5px;color:#374151;background:#f3f4f6;border-radius:5px;padding:2px 7px\">ends Dec 2026<\u002Fspan> &nbsp;has an end date<\u002Fdiv>\n              <div><span style=\"font-size:11.5px;color:#374151;background:#f3f4f6;border-radius:5px;padding:2px 7px\">one-time · Sep 2026<\u002Fspan> &nbsp;non-recurring<\u002Fdiv>\n              <div><span style=\"color:#15803d\">estimate<\u002Fspan> &nbsp;paired with the <span style=\"color:#15803d\">≈<\u002Fspan> before the label — same convention as the ledger<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px 18px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:10px\">Zero and dozen<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.65;color:#374151\">Zero added expenses is not an empty state — housing and living spend are always there, so the section is never blank and needs no illustration. Past six rows the list gets a max-height of 520px with internal scroll and a sticky \"+ Add expense\"; the two seeded rows stay pinned above the scroll area.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px\">\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Redlines<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:#374151;font-family:ui-monospace,SFMono-Regular,Menlo,monospace\">\n          <div>row card &nbsp;<span style=\"color:#6b7280\">1px #e5e7eb · radius 10 · padding 10/12<\u002Fspan><\u002Fdiv>\n          <div>row gap &nbsp;<span style=\"color:#6b7280\">8px<\u002Fspan><\u002Fdiv>\n          <div>face height &nbsp;<span style=\"color:#6b7280\">34px (input 34, label 14.5/20)<\u002Fspan><\u002Fdiv>\n          <div>amount input &nbsp;<span style=\"color:#6b7280\">w 116 · h 34 · radius 8 · 1px #d1d5db · text right · tabular-nums<\u002Fspan><\u002Fdiv>\n          <div>meta line &nbsp;<span style=\"color:#6b7280\">12px #6b7280 · margin-top 7<\u002Fspan><\u002Fdiv>\n          <div>chip &nbsp;<span style=\"color:#6b7280\">11.5px · #f3f4f6 · radius 5 · padding 2/7<\u002Fspan><\u002Fdiv>\n          <div>caret hit area &nbsp;<span style=\"color:#6b7280\">28×28 (visual glyph 11px)<\u002Fspan><\u002Fdiv>\n          <div>drawer &nbsp;<span style=\"color:#6b7280\">margin-top 12 · border-top 1px #f3f4f6 · pad-top 12 · field gap 12<\u002Fspan><\u002Fdiv>\n          <div>open row border &nbsp;<span style=\"color:#6b7280\">#111827 (existing focus-card treatment)<\u002Fspan><\u002Fdiv>\n          <div>section header → first row &nbsp;<span style=\"color:#6b7280\">14px<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;font-size:13px;line-height:1.55;color:#6b7280\">All values already in use elsewhere in the app (income line cards, modal fields). No new spacing or radius tokens.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">States<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.55;color:#374151\">\n          <div><strong style=\"color:#111827\">Default<\u002Fstrong> — border #e5e7eb, white.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Hover<\u002Fstrong> — border #d1d5db; caret glyph #6b7280.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Focus (input)<\u002Fstrong> — existing input focus ring, unchanged; row border unchanged.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Focus (caret)<\u002Fstrong> — 2px #111827 outline, offset 2, on the 28px hit area.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Open<\u002Fstrong> — row border #111827; caret rotates to ▴; drawer expands, no animation over 120ms.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Error<\u002Fstrong> — non-numeric or negative amount: input border #b91c1c + helper \"Enter a monthly amount, or 0.\" Row stays open; chart holds last valid value rather than recalculating to NaN.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Disabled<\u002Fstrong> — seeded rows have no Remove; the button is absent, not greyed.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Empty<\u002Fstrong> — n/a (seeded rows always present).<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Copy — final<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.6;color:#374151\">\n          <div>Section header: <strong style=\"color:#111827\">Expenses<\u002Fstrong>. Sub: <strong style=\"color:#111827\">$10,700/mo now · $6,700 from Sep 2026<\u002Fstrong> (second clause only when a step change or end date exists in the horizon).<\u002Fdiv>\n          <div>Seeded labels: <strong style=\"color:#111827\">Housing / rent<\u002Fstrong> · <strong style=\"color:#111827\">Living spend<\u002Fstrong> (no longer \"Target monthly spend\" — it is what you spend, not a target you are failing).<\u002Fdiv>\n          <div>Drawer: <strong style=\"color:#111827\">Starts<\u002Fstrong> · <strong style=\"color:#111827\">Ends (optional)<\u002Fstrong> · <strong style=\"color:#111827\">Amount changes later<\u002Fstrong> → <strong style=\"color:#111827\">From<\u002Fstrong> / <strong style=\"color:#111827\">New amount<\u002Fstrong> · <strong style=\"color:#111827\">This is an estimate (shows as ≈)<\u002Fstrong>.<\u002Fdiv>\n          <div>Living spend helper, in drawer: <strong style=\"color:#111827\">Upward treats this as an estimate. Change the amount any time — it stays an estimate unless you say otherwise.<\u002Fstrong><\u002Fdiv>\n          <div>Caret tooltip / aria: <strong style=\"color:#111827\">Edit schedule for Housing / rent<\u002Fstrong>.<\u002Fdiv>\n          <div>Amount error: <strong style=\"color:#111827\">Enter a monthly amount, or 0.<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Accessibility &amp; responsive<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.6;color:#374151\">\n          <div>Caret is a <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">&lt;button aria-expanded&gt;<\u002Fspan> controlling the drawer by <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">aria-controls<\u002Fspan>. Focus order: label → amount → caret → drawer fields → Remove → Done.<\u002Fdiv>\n          <div>The ≈ glyph is decorative; the estimate fact is carried by the word \"estimate\" in the meta line and by <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">aria-label=\"Living spend, estimated\"<\u002Fspan>. Color never carries it alone.<\u002Fdiv>\n          <div>Meta line 12px #6b7280 on #fff = 4.83:1. Green \"estimate\" #15803d on #fff = 4.6:1.<\u002Fdiv>\n          <div>Escape closes the drawer and returns focus to the caret. Enter in the amount input commits and keeps focus (people tab through amounts repeatedly).<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Tablet<\u002Fstrong> — panel goes full width above the chart; rows unchanged. <strong style=\"color:#111827\">Mobile (&lt;640px)<\u002Fstrong> — amount input drops to 96px, meta chips wrap to their own line, drawer fields stack to one column. Face stays one line: label truncates with ellipsis at 60% width, full label in title attribute.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"item2\" style=\"margin-bottom:80px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\">\n      <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#6b7280\">02<\u002Fspan>\n      <h2 style=\"margin:0;font-size:27px;font-weight:700;letter-spacing:-0.015em\">Per-account rate of return<\u002Fh2>\n      <span style=\"font-size:12.5px;color:#6b7280\">small<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 28px;font-size:15.5px;line-height:1.62;color:#4b5563;max-width:78ch;text-wrap:pretty\">An optional expected annual return on eligible account types, pre-filled with an Upward default, living behind the card's existing caret in a panel labelled <strong style=\"color:#111827\">Assumptions<\u002Fstrong>. The high-yield rate stops being hardcoded and becomes the first entry in that panel.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-bottom:32px\">\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#15803d;margin-bottom:12px\">The decision<\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.6;color:#374151\">The field goes <strong>behind the caret<\u002Fstrong>, in a panel headed \"Assumptions\" — the word does the work that a tooltip would do badly. Card faces stay as dense as they are today.<\u002Fp>\n        <p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.6;color:#374151\">The collapsed face keeps the existing consequence line — <span style=\"color:#15803d\">earns ≈ $13/mo at this balance<\u002Fspan> — which is already the honest surfacing of the assumption's <em>effect<\u002Fem>. When the rate is not Upward's default, the face states the rate too: <strong>assumes 6.0%/yr · earns ≈ $25/mo at this balance<\u002Fstrong>. A user's own number is never hidden from them.<\u002Fp>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#374151\">HELOC's interest rate is untouched and stays in its own visual lane: warm text, the word <em>interest<\u002Fem>, on a liability card. A cost and a return must never share a treatment.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:12px\">What lost, and why<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div>\n            <div style=\"font-size:14px;font-weight:600;color:#111827;margin-bottom:3px\">Rate input on the collapsed card face<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#6b7280\">Six to eight cards each grow a second input. The accounts grid becomes a spreadsheet, and a number nobody needs to change most days sits at the same weight as the balance.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:14px;font-weight:600;color:#111827;margin-bottom:3px\">Global \"expected return\" in a settings row<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#6b7280\">One rate cannot be right for cash and equities at once, and a global control implies Upward knows better than the account. Rejected.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:14px;font-weight:600;color:#111827;margin-bottom:3px\">Info icon + tooltip instead of a labelled panel<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#6b7280\">\"Show the work\" cannot depend on hover. Tooltips are invisible on touch and to anyone who does not think to ask.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #e5e7eb;border-radius:12px;background:#f7f7f8;padding:26px;margin-bottom:28px\">\n      <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:18px\">Mockup — account card, collapsed face vs. Assumptions panel<\u002Fdiv>\n      <div style=\"display:flex;gap:20px;flex-wrap:wrap\">\n\n        <div style=\"width:420px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px\">\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <span style=\"width:22px;height:22px;border-radius:6px;background:#6d28d9;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center\">3<\u002Fspan>\n            <div style=\"flex:1;font-size:15px;color:#111827\">High-Yield Savings<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;border:1px solid #d1d5db;border-radius:8px;padding:6px 10px;width:120px\">\n              <span style=\"font-size:13px;color:#9ca3af\">$<\u002Fspan>\n              <span style=\"flex:1;text-align:right;font-size:14.5px;font-variant-numeric:tabular-nums\">4,000<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:15px;color:#9ca3af;padding:2px 4px\">×<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;margin-top:10px\">\n            <div style=\"flex:1;border:1px solid #d1d5db;border-radius:8px;padding:7px 10px;font-size:13.5px;color:#111827;display:flex;justify-content:space-between\">High-yield savings <span style=\"color:#9ca3af\">⌄<\u002Fspan><\u002Fdiv>\n            <span style=\"font-size:11px;color:#374151;padding:4px\">▴<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:1.5;color:#6b7280;margin-top:8px\">Savings that earns interest. No tax to withdraw; yield is modeled as a small inflow. · <span style=\"color:#15803d\">assumes 4.2%/yr · earns ≈ $14/mo at this balance<\u002Fspan><\u002Fdiv>\n\n          <div style=\"margin-top:12px;padding-top:12px;border-top:1px solid #f3f4f6\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\">\n              <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280\">Assumptions<\u002Fdiv>\n              <button style=\"font-size:12.5px;color:#6b7280;background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px\">Reset to default<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <div style=\"flex:1;font-size:13.5px;color:#374151\">Expected annual return<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:6px;border:1px solid #d1d5db;border-radius:8px;padding:6px 10px;width:96px\">\n                <span style=\"flex:1;text-align:right;font-size:14px;font-variant-numeric:tabular-nums\">4.2<\u002Fspan>\n                <span style=\"font-size:13px;color:#9ca3af\">%<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.5;color:#6b7280;margin-top:7px\">Upward's default for high-yield savings. Change it to match your account. Applied monthly, before tax.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"width:420px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:10px\">Collapsed face — default rate<\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.5;color:#6b7280\">Taxable investments. Capital-gains tax on the gains portion; no early-withdrawal penalty. · <span style=\"color:#15803d\">assumes 6.0%/yr · grows ≈ $25/mo at this balance<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:10px\">Collapsed face — user-set rate<\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.5;color:#6b7280\">Taxable investments. Capital-gains tax on the gains portion; no early-withdrawal penalty. · <span style=\"color:#15803d\">your rate: 8.5%/yr · grows ≈ $35/mo at this balance<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#9ca3af;margin-top:8px\">\"your rate\" replaces \"assumes\" the moment the value differs from the default — the only diff on the face.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:10px\">Liability — unchanged, do not touch<\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.5;color:#6b7280\">Available credit · Borrowed money. No tax, but monthly interest accrues on the drawn balance starting the month after a draw. · <span style=\"color:#c2410c\">≈ $71/mo interest per $10k drawn<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:10px\">Defaults, and eligibility<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:5px;font-size:13px;color:#374151;font-family:ui-monospace,SFMono-Regular,Menlo,monospace\">\n              <div>high-yield savings &nbsp;<span style=\"color:#111827\">4.2%<\u002Fspan><\u002Fdiv>\n              <div>brokerage / investment &nbsp;<span style=\"color:#111827\">6.0%<\u002Fspan><\u002Fdiv>\n              <div>Roth retirement &nbsp;<span style=\"color:#111827\">6.0%<\u002Fspan><\u002Fdiv>\n              <div>pre-tax retirement &nbsp;<span style=\"color:#111827\">6.0%<\u002Fspan><\u002Fdiv>\n              <div>other &nbsp;<span style=\"color:#111827\">0.0%<\u002Fspan><\u002Fdiv>\n              <div style=\"color:#6b7280\">everyday / checking &nbsp;— no panel<\u002Fdiv>\n              <div style=\"color:#6b7280\">savings &nbsp;— no panel<\u002Fdiv>\n              <div style=\"color:#6b7280\">credit line / HELOC &nbsp;— unchanged<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.5;color:#6b7280;margin-top:9px\">Ineligible types show no Assumptions panel at all rather than a disabled field — an empty greyed input reads as broken.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px\">\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Redlines &amp; states<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;color:#374151;font-family:ui-monospace,SFMono-Regular,Menlo,monospace\">\n          <div>panel &nbsp;<span style=\"color:#6b7280\">margin-top 12 · border-top 1px #f3f4f6 · pad-top 12<\u002Fspan><\u002Fdiv>\n          <div>rate input &nbsp;<span style=\"color:#6b7280\">w 96 · h 32 · radius 8 · 1px #d1d5db · right-aligned · suffix % #9ca3af<\u002Fspan><\u002Fdiv>\n          <div>label &nbsp;<span style=\"color:#6b7280\">13.5px #374151<\u002Fspan><\u002Fdiv>\n          <div>helper &nbsp;<span style=\"color:#6b7280\">12.5px/1.5 #6b7280 · margin-top 7<\u002Fspan><\u002Fdiv>\n          <div>face rate clause &nbsp;<span style=\"color:#6b7280\">12.5px #15803d, appended to existing helper with \" · \"<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.55;color:#374151\">\n          <div><strong style=\"color:#111827\">Default<\u002Fstrong> — pre-filled, never blank.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Changed<\u002Fstrong> — \"Reset to default\" appears (absent while at default).<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Error<\u002Fstrong> — outside −20…40: border #b91c1c, helper \"Enter a rate between −20% and 40%.\" Last valid rate stays in the model.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Zero<\u002Fstrong> — 0% is valid and legal; face reads \"your rate: 0%/yr · no growth modeled\".<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Copy — final<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.6;color:#374151\">\n          <div>Panel heading: <strong style=\"color:#111827\">Assumptions<\u002Fstrong><\u002Fdiv>\n          <div>Label: <strong style=\"color:#111827\">Expected annual return<\u002Fstrong><\u002Fdiv>\n          <div>Helper (default): <strong style=\"color:#111827\">Upward's default for {type}. Change it to match your account. Applied monthly, before tax.<\u002Fstrong><\u002Fdiv>\n          <div>Helper (changed): <strong style=\"color:#111827\">Your rate. Applied monthly, before tax.<\u002Fstrong><\u002Fdiv>\n          <div>Reset: <strong style=\"color:#111827\">Reset to default<\u002Fstrong><\u002Fdiv>\n          <div>Face, default: <strong style=\"color:#111827\">assumes {r}%/yr · grows ≈ ${n}/mo at this balance<\u002Fstrong> (savings types keep \"earns\")<\u002Fdiv>\n          <div>Face, changed: <strong style=\"color:#111827\">your rate: {r}%/yr · grows ≈ ${n}/mo at this balance<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Accessibility &amp; responsive<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.6;color:#374151\">\n          <div>Input is <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">type=\"number\" inputmode=\"decimal\" step=\"0.1\"<\u002Fspan>, labelled by the visible label; helper wired via <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">aria-describedby<\u002Fspan> so the assumption is announced with the field.<\u002Fdiv>\n          <div>The panel is a region labelled \"Assumptions for High-Yield Savings\"; the caret button carries <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">aria-expanded<\u002Fspan>.<\u002Fdiv>\n          <div>#15803d on #fff = 4.6:1; #6b7280 on #fff = 4.83:1; #c2410c on #fff = 4.7:1. Green vs. orange is never the only signal — the words \"grows\"/\"interest\" differ.<\u002Fdiv>\n          <div>Recalculation is debounced 250ms so a screen reader is not fighting a live-updating runway figure mid-keystroke.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Mobile<\u002Fstrong> — panel is full card width; label and input stay on one line (input 88px). Type dropdown, balance and caret order unchanged.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"item3\" style=\"margin-bottom:80px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\">\n      <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#6b7280\">03<\u002Fspan>\n      <h2 style=\"margin:0;font-size:27px;font-weight:700;letter-spacing:-0.015em\">Penalty-free date on pre-tax retirement<\u002Fh2>\n      <span style=\"font-size:12.5px;color:#6b7280\">small · copy is the work<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 28px;font-size:15.5px;line-height:1.62;color:#4b5563;max-width:78ch;text-wrap:pretty\">One optional month/year field, pre-tax retirement accounts only, in the same Assumptions panel as item 2 — second row, under the return. Blank means the 10% penalty applies throughout; a past month means it never applies; a future month waives it from that month forward.<\u002Fp>\n\n    <div style=\"border:1px solid #e5e7eb;border-radius:12px;background:#f7f7f8;padding:26px;margin-bottom:28px\">\n      <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:18px\">Mockup — pre-tax IRA card, Assumptions panel open<\u002Fdiv>\n      <div style=\"display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start\">\n        <div style=\"width:420px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px\">\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <span style=\"width:22px;height:22px;border-radius:6px;background:#92400e;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center\">6<\u002Fspan>\n            <div style=\"flex:1;font-size:15px;color:#111827\">Pre-tax IRA<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;border:1px solid #d1d5db;border-radius:8px;padding:6px 10px;width:120px\">\n              <span style=\"font-size:13px;color:#9ca3af\">$<\u002Fspan>\n              <span style=\"flex:1;text-align:right;font-size:14.5px;font-variant-numeric:tabular-nums\">3,000<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:15px;color:#9ca3af;padding:2px 4px\">×<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;margin-top:10px\">\n            <div style=\"flex:1;border:1px solid #d1d5db;border-radius:8px;padding:7px 10px;font-size:13.5px;color:#111827;display:flex;justify-content:space-between\">Pre-tax retirement (Traditional IRA / 401k) <span style=\"color:#9ca3af\">⌄<\u002Fspan><\u002Fdiv>\n            <span style=\"font-size:11px;color:#374151;padding:4px\">▴<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:1.5;color:#6b7280;margin-top:8px\">Full withdrawal taxed as ordinary income, plus a 10% early-withdrawal penalty. · <span style=\"color:#15803d\">assumes 6.0%/yr · grows ≈ $15/mo at this balance<\u002Fspan> · <span style=\"color:#374151\">penalty-free from Mar 2027<\u002Fspan><\u002Fdiv>\n\n          <div style=\"margin-top:12px;padding-top:12px;border-top:1px solid #f3f4f6\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:10px\">Assumptions<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">\n              <div style=\"flex:1;font-size:13.5px;color:#374151\">Expected annual return<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:6px;border:1px solid #d1d5db;border-radius:8px;padding:6px 10px;width:96px\">\n                <span style=\"flex:1;text-align:right;font-size:14px;font-variant-numeric:tabular-nums\">6.0<\u002Fspan>\n                <span style=\"font-size:13px;color:#9ca3af\">%<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <div style=\"flex:1;font-size:13.5px;color:#374151\">Penalty-free after <span style=\"color:#9ca3af\">(optional)<\u002Fspan><\u002Fdiv>\n              <div style=\"border:1px solid #d1d5db;border-radius:8px;padding:6px 10px;width:120px;font-size:13.5px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between\"><span>03/2027<\u002Fspan><span style=\"color:#9ca3af\">▤<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.5;color:#6b7280;margin-top:7px\">Withdrawals from this account before age 59½ carry a 10% penalty. If you reach 59½ during this projection, enter that month and Upward stops applying the penalty from then on. Leave it blank and the penalty applies the whole way.<\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.5;color:#374151;margin-top:8px;padding:8px 10px;background:#f7f7f8;border-radius:8px\">Penalty applied Aug 2026 – Feb 2027, then waived. Upward models the penalty only — it isn't tax advice.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;min-width:340px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px 20px\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:12px\">The status line — one per state, always present<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.55\">\n              <div style=\"padding:8px 10px;background:#f7f7f8;border-radius:8px;color:#374151\"><strong style=\"color:#111827\">Blank<\u002Fstrong> — Penalty applied to every withdrawal in this projection. Add a month above if you'll turn 59½ before it ends.<\u002Fdiv>\n              <div style=\"padding:8px 10px;background:#f7f7f8;border-radius:8px;color:#374151\"><strong style=\"color:#111827\">Future month<\u002Fstrong> — Penalty applied Aug 2026 – Feb 2027, then waived.<\u002Fdiv>\n              <div style=\"padding:8px 10px;background:#f7f7f8;border-radius:8px;color:#374151\"><strong style=\"color:#111827\">Past month<\u002Fstrong> — No penalty applied — you were already past 59½ when this projection starts.<\u002Fdiv>\n              <div style=\"padding:8px 10px;background:#f7f7f8;border-radius:8px;color:#374151\"><strong style=\"color:#111827\">Month after horizon<\u002Fstrong> — Penalty applied for the whole projection; the waiver starts after it ends.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.55;color:#6b7280;margin-top:10px\">The status line is the honesty mechanism: it restates the consequence in months, so nobody has to reason about the rule to check the field is doing what they meant. \"It isn't tax advice\" rides on this line and nowhere else — no banner, no asterisk, no legal block.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px 20px\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:12px\">Why this shape (keep for the implementer)<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.6;color:#374151\">Age is a lever here, not a demographic fact — so there is no global age input, because a global field invites collection Upward has decided not to do. A checkbox was rejected because it cannot express someone crossing 59½ mid-projection, which is exactly the case that produces wrong numbers today. Do not \"simplify\" this to a toggle.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px 20px\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:12px\">Redlines · states · a11y · responsive<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.55;color:#374151\">\n              <div><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">&lt;input type=\"month\"&gt;<\u002Fspan> · w 120 · h 32 · radius 8 · 1px #d1d5db · tabular-nums. Same geometry as the AS OF date input.<\u002Fdiv>\n              <div>Status line: 12.5px/1.5 #374151 on #f7f7f8, radius 8, padding 8/10, margin-top 8. Reuses the panel-note treatment; no new token.<\u002Fdiv>\n              <div>States — <strong style=\"color:#111827\">empty<\u002Fstrong> shows placeholder <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">mm/yyyy<\u002Fspan>; <strong style=\"color:#111827\">hover/focus<\u002Fstrong> per existing input; <strong style=\"color:#111827\">error<\u002Fstrong> is impossible (month input is constrained) — an unparseable pasted value falls back to blank and the status line says so; a clear affordance (\"Clear\") appears only when set.<\u002Fdiv>\n              <div>Field only renders for <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">type === 'pretax'<\u002Fspan>. Changing type away discards the value and the status line confirms: \"Penalty-free month removed with the type change.\"<\u002Fdiv>\n              <div><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">aria-describedby<\u002Fspan> points at helper + status line, so a screen reader hears the rule and the resulting month range together. Status line is <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">aria-live=\"polite\"<\u002Fspan>.<\u002Fdiv>\n              <div>Mobile — label wraps above the field; field goes full width. Native month picker on iOS/Android is acceptable; do not build a custom one.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"item4\" style=\"margin-bottom:80px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\">\n      <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#6b7280\">04<\u002Fspan>\n      <h2 style=\"margin:0;font-size:27px;font-weight:700;letter-spacing:-0.015em\">Account include / exclude<\u002Fh2>\n      <span style=\"font-size:12.5px;color:#6b7280\">small · highest confusion risk<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 28px;font-size:15.5px;line-height:1.62;color:#4b5563;max-width:78ch;text-wrap:pretty\">Hold an account out of the runway without deleting it. One treatment, applied identically in three places, built from one idea: <strong style=\"color:#111827\">an excluded account loses its tap-order number.<\u002Fstrong> The number is the account's place in the drawdown sequence; something not in the sequence cannot have one. That single fact reads on the card, in the legend and in the ledger without any new color.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px\">\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#15803d;margin-bottom:12px\">The decision<\u002Fdiv>\n        <p style=\"margin:0 0 10px;font-size:14.5px;line-height:1.6;color:#374151\">Control: a text button on the card face, left of the × — <strong>Exclude<\u002Fstrong> / <strong>Include<\u002Fstrong>. On the face, not behind the caret: a state that changes the headline number cannot be reachable only by disclosure.<\u002Fp>\n        <p style=\"margin:0 0 10px;font-size:14.5px;line-height:1.6;color:#374151\">Excluded card: number chip goes hollow with an em dash, border goes dashed, inputs stay fully legible at 100% opacity (this is not disabled data — it is real money, held aside), and a single gray line states the consequence. Remaining accounts renumber immediately.<\u002Fp>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#374151\">A persistent count in the Accounts header is the safety net for the returning user: the header always says how much is held out, so nobody has to remember what they did five minutes ago.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px 26px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:12px\">What lost, and why<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div>\n            <div style=\"font-size:14px;font-weight:600;color:#111827;margin-bottom:3px\">Opacity / greying the whole card<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#6b7280\">Reads as disabled or errored, and makes a balance the user still needs to edit hard to read. Excluded accounts remain fully editable.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:14px;font-weight:600;color:#111827;margin-bottom:3px\">A switch labelled \"Included in runway\"<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#6b7280\">Upward has no switches. Adding a control vocabulary for one feature costs more than it earns; the text button derives from the existing × / \"Start fresh\" text-action pattern.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:14px;font-weight:600;color:#111827;margin-bottom:3px\">Moving excluded cards to a separate collapsed group<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#6b7280\">Out of sight is exactly the failure mode named in the brief. Excluded cards stay in place, in the grid, at the end of the tap order.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #e5e7eb;border-radius:12px;background:#f7f7f8;padding:26px;margin-bottom:28px\">\n      <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:18px\">Mockup — the same exclusion in three places<\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px\">\n          <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:16px\">\n            <span style=\"font-size:13px;font-weight:600;letter-spacing:.06em;color:#6b7280\">ACCOUNTS<\u002Fspan>\n            <span style=\"font-size:13px;color:#6b7280\">$19,000 counted in runway · $3,000 excluded · drag to set tap order<\u002Fspan>\n            <span style=\"margin-left:auto;font-size:13px;color:#111827;border:1px solid #d1d5db;border-radius:8px;padding:6px 11px\">+ Add account<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n            <div style=\"border:1px solid #e5e7eb;border-radius:12px;padding:14px\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <span style=\"width:22px;height:22px;border-radius:6px;background:#0f766e;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center\">1<\u002Fspan>\n                <div style=\"flex:1;font-size:15px;color:#111827\">Everyday Checking<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:6px;border:1px solid #d1d5db;border-radius:8px;padding:6px 10px;width:112px\">\n                  <span style=\"font-size:13px;color:#9ca3af\">$<\u002Fspan>\n                  <span style=\"flex:1;text-align:right;font-size:14.5px;font-variant-numeric:tabular-nums\">3,000<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size:12.5px;color:#6b7280;text-decoration:underline;text-underline-offset:2px\">Exclude<\u002Fspan>\n                <span style=\"font-size:15px;color:#9ca3af\">×<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#6b7280;margin-top:9px\">Operating cash you spend from day to day.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px dashed #9ca3af;border-radius:12px;padding:14px;background:#fcfcfd\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <span style=\"width:22px;height:22px;border-radius:6px;border:1px dashed #9ca3af;color:#6b7280;font-size:12px;display:flex;align-items:center;justify-content:center\">—<\u002Fspan>\n                <div style=\"flex:1;font-size:15px;color:#111827\">Pre-tax IRA<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:6px;border:1px solid #d1d5db;border-radius:8px;padding:6px 10px;width:112px;background:#fff\">\n                  <span style=\"font-size:13px;color:#9ca3af\">$<\u002Fspan>\n                  <span style=\"flex:1;text-align:right;font-size:14.5px;font-variant-numeric:tabular-nums\">3,000<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size:12.5px;color:#111827;text-decoration:underline;text-underline-offset:2px\">Include<\u002Fspan>\n                <span style=\"font-size:15px;color:#9ca3af\">×<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#374151;margin-top:9px\"><strong>Excluded<\u002Fstrong> — this $3,000 isn't part of your runway. Balance and settings are kept.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">In the chart legend<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px\">\n              <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:11px;height:11px;border-radius:3px;background:#0f766e\"><\u002Fspan>Everyday Checking<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:11px;height:11px;border-radius:3px;background:#7dd3fc;border:1px solid #0284c7\"><\u002Fspan>Savings<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:11px;height:11px;border-radius:3px;background:#4338ca\"><\u002Fspan>High-Yield Savings<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:7px;color:#6b7280\"><span style=\"width:11px;height:11px;border-radius:3px;border:1px dashed #9ca3af\"><\u002Fspan><span style=\"text-decoration:line-through\">Pre-tax IRA<\u002Fspan> <span style=\"font-size:12px\">excluded<\u002Fspan><\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:7px;color:#374151\"><span style=\"width:14px;height:0;border-top:2px solid #111827\"><\u002Fspan>Net liquid<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.55;color:#6b7280;margin-top:12px\">Excluded series stay in the legend, in tap-order position, with a hollow dashed swatch and struck-through label. They draw no band. Keeping them listed is what tells a returning user why a band is missing.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">In the ledger (expanded month)<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13.5px\">\n              <div style=\"display:flex;gap:10px;color:#374151\"><span style=\"width:150px\">Everyday Checking<\u002Fspan><span style=\"color:#6b7280\">open $3,000<\u002Fspan><span style=\"color:#15803d;background:#ecfdf5;border-radius:5px;padding:0 6px\">Income +$9,000<\u002Fspan><span style=\"color:#6b7280\">close $2,700<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:10px;color:#374151\"><span style=\"width:150px\">High-Yield Savings<\u002Fspan><span style=\"color:#6b7280\">open $4,000<\u002Fspan><span style=\"color:#15803d;background:#ecfdf5;border-radius:5px;padding:0 6px\">≈ Interest +$14<\u002Fspan><span style=\"color:#6b7280\">close $4,014<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:10px;color:#6b7280;padding-top:7px;border-top:1px dashed #e5e7eb\"><span style=\"width:150px;text-decoration:line-through\">Pre-tax IRA<\u002Fspan><span>excluded · $3,000 held, not counted<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.55;color:#6b7280;margin-top:12px\">Excluded accounts sort to the bottom of the per-account lines, above a dashed rule, with no open/close figures — because nothing happened to them. CSV exports keep the row with an <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px\">excluded<\u002Fspan> column so the trail stays auditable.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px\">\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Redlines &amp; states<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;color:#374151;font-family:ui-monospace,SFMono-Regular,Menlo,monospace\">\n          <div>card border &nbsp;<span style=\"color:#6b7280\">1px dashed #9ca3af (was 1px solid #e5e7eb)<\u002Fspan><\u002Fdiv>\n          <div>card bg &nbsp;<span style=\"color:#6b7280\">#fcfcfd<\u002Fspan><\u002Fdiv>\n          <div>chip &nbsp;<span style=\"color:#6b7280\">22×22 · radius 6 · 1px dashed #9ca3af · glyph \"—\" 12px #6b7280<\u002Fspan><\u002Fdiv>\n          <div>action &nbsp;<span style=\"color:#6b7280\">12.5px underlined · #6b7280 idle / #111827 when excluded · 28px hit height<\u002Fspan><\u002Fdiv>\n          <div>legend swatch &nbsp;<span style=\"color:#6b7280\">11×11 · radius 3 · 1px dashed #9ca3af · no fill<\u002Fspan><\u002Fdiv>\n          <div>ledger rule &nbsp;<span style=\"color:#6b7280\">1px dashed #e5e7eb · pad-top 7<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.55;color:#374151\">\n          <div><strong style=\"color:#111827\">Hover<\u002Fstrong> — action darkens to #111827; card border unchanged.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Focus<\u002Fstrong> — 2px #111827 ring on the action.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Drag<\u002Fstrong> — excluded cards are not draggable; drag handle shows no grab cursor and the drop indicator skips them.<\u002Fdiv>\n          <div><strong style=\"color:#111827\">All accounts excluded<\u002Fstrong> — runway reads <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">0.0 months<\u002Fspan>, chart shows an empty plot with the caption \"Every account is excluded. Include one to see a runway.\" No error styling.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Copy — final<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.6;color:#374151\">\n          <div>Actions: <strong style=\"color:#111827\">Exclude<\u002Fstrong> / <strong style=\"color:#111827\">Include<\u002Fstrong><\u002Fdiv>\n          <div>Card line: <strong style=\"color:#111827\">Excluded — this $3,000 isn't part of your runway. Balance and settings are kept.<\u002Fstrong><\u002Fdiv>\n          <div>Header, nothing excluded: <strong style=\"color:#111827\">$22,000 in assets · drag to set tap order<\u002Fstrong> (unchanged)<\u002Fdiv>\n          <div>Header, something excluded: <strong style=\"color:#111827\">$19,000 counted in runway · $3,000 excluded · drag to set tap order<\u002Fstrong><\u002Fdiv>\n          <div style=\"color:#6b7280\">\"In assets\" becomes \"counted in runway\" only while an exclusion exists — the phrase has to name what the number now means, and a total labelled \"assets\" that omits assets would be a lie.<\u002Fdiv>\n          <div>Legend: <strong style=\"color:#111827\">Pre-tax IRA — excluded<\u002Fstrong><\u002Fdiv>\n          <div>Ledger: <strong style=\"color:#111827\">excluded · $3,000 held, not counted<\u002Fstrong><\u002Fdiv>\n          <div>Tooltip on action: <strong style=\"color:#111827\">Hold this account out of the runway. Nothing is deleted.<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:14px\">Accessibility &amp; responsive<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.6;color:#374151\">\n          <div>Action is a button with <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">aria-pressed<\u002Fspan>; accessible name \"Exclude Pre-tax IRA from runway\".<\u002Fdiv>\n          <div>The card carries <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">aria-describedby<\u002Fspan> → the \"Excluded\" line, so the state is announced when focus enters the card, not just seen.<\u002Fdiv>\n          <div>Toggling fires a polite live-region announcement: \"Pre-tax IRA excluded. Runway 6.1 months, down 2.2.\" The runway change is the thing a screen-reader user would otherwise miss entirely.<\u002Fdiv>\n          <div>Dashed border + em-dash chip + struck label + explicit word \"excluded\" — four non-color signals. Contrast: #6b7280 on #fcfcfd = 4.7:1; dashed #9ca3af border on #fcfcfd = 2.6:1 (non-text, meets 3:1 with the chip glyph as the load-bearing cue).<\u002Fdiv>\n          <div><strong style=\"color:#111827\">Tablet<\u002Fstrong> — accounts grid 2-up, unchanged. <strong style=\"color:#111827\">Mobile<\u002Fstrong> — 1-up; the action moves to the row under the balance, left-aligned, 13px, so it never competes with × for a thumb. Header wraps to two lines with the excluded clause on the second.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"item5\" style=\"margin-bottom:80px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\">\n      <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#6b7280\">05<\u002Fspan>\n      <h2 style=\"margin:0;font-size:27px;font-weight:700;letter-spacing:-0.015em\">Graph by account, as columns<\u002Fh2>\n      <span style=\"font-size:12.5px;color:#6b7280\">medium<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 28px;font-size:15.5px;line-height:1.62;color:#4b5563;max-width:78ch;text-wrap:pretty\">Stacked columns, one series per account, Net liquid retained as an overlay line. The data is monthly buckets; area implies interpolation between months that the model does not compute. Columns are the honest encoding.<\u002Fp>\n\n    <div style=\"border:1px solid #e5e7eb;border-radius:12px;background:#f7f7f8;padding:26px;margin-bottom:28px\">\n      <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:18px\">Mockup — runway chart, example scenario (Jan '27 hovered)<\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px\">\n          <div style=\"display:flex;align-items:baseline;gap:10px\">\n            <span style=\"font-size:13px;font-weight:600;letter-spacing:.06em;color:#6b7280\">RUNWAY BY ACCOUNT<\u002Fspan>\n            <span style=\"font-size:13px;color:#6b7280\">Example scenario<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:stretch;border:1px solid #d1d5db;border-radius:8px;overflow:hidden\">\n            <span style=\"font-size:12.5px;padding:5px 12px;color:#374151\">Balances · total<\u002Fspan>\n            <span style=\"font-size:12.5px;padding:5px 12px;background:#111827;color:#fff;border-left:1px solid #e5e7eb\">Balances · by account<\u002Fspan>\n            <span style=\"font-size:12.5px;padding:5px 12px;color:#374151;border-left:1px solid #d1d5db\">Drawdown · by account<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#6b7280;margin-bottom:10px\">What you have left at the end of each month, split by account in tap order. Baseline — your plan, carried forward, no changes.<\u002Fdiv>\n\n        <div style=\"position:relative\">\n          <svg sc-camel-view-box=\"0 0 960 368\" style=\"width:100%;height:auto;display:block\" role=\"img\" aria-label=\"Stacked column chart of account balances by month, August 2026 to April 2027. Cash-zero at the end of April 2027.\">\n            <rect x=\"526\" y=\"40\" width=\"72\" height=\"260\" fill=\"#f7f7f8\"><\u002Frect>\n            <line x1=\"64\" y1=\"300\" x2=\"944\" y2=\"300\" stroke=\"#d1d5db\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"64\" y1=\"240\" x2=\"944\" y2=\"240\" stroke=\"#f1f5f9\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"64\" y1=\"180\" x2=\"944\" y2=\"180\" stroke=\"#f1f5f9\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"64\" y1=\"120\" x2=\"944\" y2=\"120\" stroke=\"#f1f5f9\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"64\" y1=\"60\" x2=\"944\" y2=\"60\" stroke=\"#f1f5f9\" stroke-width=\"1\"><\u002Fline>\n            <text x=\"56\" y=\"304\" text-anchor=\"end\" font-size=\"11\" fill=\"#9ca3af\">$0<\u002Ftext>\n            <text x=\"56\" y=\"244\" text-anchor=\"end\" font-size=\"11\" fill=\"#9ca3af\">$7.5k<\u002Ftext>\n            <text x=\"56\" y=\"184\"
